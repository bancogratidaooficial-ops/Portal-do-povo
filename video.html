<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRATIFLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
header{background:#000;padding:12px 15px;position:sticky;top:0;z-index:99;border-bottom:2px solid #ffcc00;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-size:28px;font-weight:900;color:#ffcc00}.logo b{color:#fff}
.search{flex:1;max-width:350px;position:relative}.search input{width:100%;padding:10px 12px 10px 38px;border-radius:20px;border:1px solid #333;background:#111;color:#fff}.search i{position:absolute;left:12px;top:10px}
.btn{padding:9px 16px;border-radius:20px;border:none;font-weight:bold;cursor:pointer}.btn-add{background:#ffcc00;color:#000}.btn-back{background:#222;color:#ffcc00;border:1px solid #ffcc00}
.cat{padding:20px 15px 8px;color:#ffcc00;font-weight:bold;border-left:4px solid #ffcc00;margin:15px 15px 10px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 12px 30px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.card{background:#111;border-radius:10px;overflow:hidden;border:1px solid #222}.card:hover{border-color:#ffcc00;transform:scale(1.03)}
.thumb{aspect-ratio:16/9;position:relative;cursor:pointer;background:#000}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,204,0,.92);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:20px}
.info{padding:7px}.titulo{font-size:12px;height:30px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acoes{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.acoes button{background:#222;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer}.acoes button:hover{background:#ffcc00}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:999;align-items:center;justify-content:center;padding:10px}.modal.on{display:flex}.box{width:100%;max-width:850px;background:#111;border-radius:12px;overflow:hidden;border:2px solid #ffcc00}.box-top{display:flex;justify-content:space-between;padding:10px 12px;background:#000;color:#ffcc00;font-weight:bold}.box-top button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer} iframe{width:100%;height:48vw;max-height:480px;border:0}
#addForm{display:none;gap:8px;padding:12px;background:#111;border-bottom:2px solid #ffcc00;flex-wrap:wrap} #addForm.on{display:flex} #addForm input{flex:1;min-width:130px;padding:11px;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
</style>
</head>
<body>
<header>
<div class="logo">GRATI<b>FLIX</b></div>
<div class="search"><i>🔍</i><input id="q" placeholder="Buscar..." oninput="render()"></div>
<div><button class="btn btn-add" onclick="toggleAdd()">+ ADD</button> <button class="btn btn-back" onclick="location.href='../'">VOLTAR</button></div>
</header>
<div id="addForm">
<input id="newTitle" placeholder="Título (ex: Vídeo 086)">
<input id="newLink" placeholder="Link YouTube">
<button class="btn btn-add" onclick="addNew()">SALVAR</button>
<button class="btn btn-back" onclick="toggleAdd()">X</button>
</div>
<div class="cat">🎬 GRATIFLIX TV - <span id="total"></span> VÍDEOS</div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal') closeModal()">
<div class="box">
<div class="box-top"><span id="mTitle"></span><button onclick="closeModal()">✕</button></div>
<iframe id="player" allowfullscreen></iframe>
</div>
</div>
<script>
const videosIniciais = ["Xz1YqiFiNZQ","32zwH-IvzAs","ouC258B1jKo","ZKXBcPbFTMs","qKRyqXnwbNI","MUZ4FpGzsqU","tMGWE_qqxkE","bSKIBqSHrNI","0hNT_vhdCcc","Gnv_rD6sJgM","kDBSwSeSd8o","t89cAmA3oec","PuVuB9iKZGg","eBNd-V4duWY","RJdueseYras","VPT0gE8Ve3I","t5nv9FneoZs","SxVNIJlcM7o","-6r0nt0gmWY","cZYOWew11MM","KSA8LJBcuBw","ifEyKWNjSHQ","6vyGebfwe94","XUW0012sA7o","tOpNproAsa4","QOcbqIMBGEo","oBt9z6Qpb1w","GwzaCpHKSco","LniTsQUUaIY","g20SBcNiqvI","16iMqoXFdwA","fZTEVgeYmd4","t5-es5PlQUs","vZj0X0Qzstg","ajMd9c8QHMI","HPIQ3-eJmwY","JkwFWFbir1E","zsdQFZnDfoA","PNRXZx3Bz-Q","kU-7uPQZBWM","QEvlM0VxIt4","cYxgBL9X-4Q","kNl7YVgvAXk","fUyp2e3R1i8","8jshmm8ev74","xdvl0KfI3dk","ERdCY4rgdIc","CSe_rCyNGzs","bQQ0PGVAGaQ","68WyOt9egTU","nqxCRAzakE8","R6Iq8aSt0Zg","53yDYHibm04","yysbH_A8sXM","jYBruJX9RHw","qw1bSUmXpUY","O_PlC4DZaiw","TiSz_xUkoIY","UVk6EDSCKMc","s-GgY7QiYSE","qzy5S3LQ0Nw","IFSUcW4Spag","iBZukP-9XdA","FD4CeWNIQdk","3cAaosl9FoY","tWZxrVwUyN8","9CjByZriDkA","8h54C7tIj-M","IkUCBicGnk0","MbgjeF9QAVE","fwLrlXZTdK0","KKJ5e_ksjO4","qIN82R8MLrQ","ZXc-hKDDGRA","i_QMcbI61yo","Br9PbQBuQtg","3f5TlLMocHs","RZ4p-VyShMU","3k35crCBBB4","nIHU2SVLNQ0","poGy3eNjO3A","zGgrvHKKHuA","8Uufoi9xv7Q","TaDQWHlC8YY","G9qBZ6NaMfY","ppmUuEv6TBk"];
function getId(url){let m=url.match(/(?:v=|\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); if(m) return m[1]; if(/^[A-Za-z0-9_-]{11}$/.test(url)) return url; return null;}
function load(){let s=localStorage.getItem('gratiflix_v3'); if(s) return JSON.parse(s); let arr = videosIniciais.map((id,i)=>({titulo:`Vídeo ${String(i+1).padStart(3,'0')}`, vid:id, link:`https://youtu.be/${id}`})); localStorage.setItem('gratiflix_v3', JSON.stringify(arr)); return arr;}
let lista = load();
function save(){localStorage.setItem('gratiflix_v3', JSON.stringify(lista))}
function render(){let q=document.getElementById('q').value.toLowerCase(); let g=document.getElementById('grid'); g.innerHTML=''; let f=lista.filter(v=>v.titulo.toLowerCase().includes(q)); document.getElementById('total').innerText=f.length; f.forEach(v=>{let i=lista.indexOf(v); g.innerHTML+=`<div class="card"><div class="thumb" onclick="play('${v.vid}','${v.titulo.replace(/'/g,'')}')"><img src="https://img.youtube.com/vi/${v.vid}/hqdefault.jpg" loading="lazy"><div class="play">▶</div></div><div class="info"><div class="titulo">${v.titulo}</div><div class="acoes"><button onclick="renomear(${i})">✏️</button><span style="font-size:10px;color:#666">#${String(i+1).padStart(3,'0')}</span><button onclick="apagar(${i})">🗑️</button></div></div></div>`;});}
function play(vid,t){document.getElementById('mTitle').innerText=t;document.getElementById('player').src=`https://www.youtube.com/embed/${vid}?autoplay=1`;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on');document.getElementById('player').src=''}
function renomear(i){let n=prompt('Novo nome:', lista[i].titulo); if(n&&n.trim()){lista[i].titulo=n.trim();save();render()}}
function apagar(i){if(confirm('Apagar '+lista[i].titulo+'?')){lista.splice(i,1);save();render()}}
function toggleAdd(){document.getElementById('addForm').classList.toggle('on')}
function addNew(){let t=document.getElementById('newTitle').value.trim(); let l=document.getElementById('newLink').value.trim(); let vid=getId(l); if(!vid){alert('Link inválido!');return} if(!t) t=`Vídeo ${String(lista.length+1).padStart(3,'0')}`; lista.push({titulo:t, vid:vid, link:l}); save();render(); document.getElementById('newTitle').value='';document.getElementById('newLink').value=''; toggleAdd();}
render();
</script>
</body>
</html>
