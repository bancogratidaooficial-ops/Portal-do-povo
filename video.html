<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Gratidão - Dentro do App</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;background:#111;border:1px solid #ffcc00;padding:10px;border-radius:12px}
a{color:#ffcc00;text-decoration:none;font-weight:bold}
.box{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin-top:10px}
input{width:100%;padding:14px;border-radius:10px;background:#000;color:#fff;border:1px solid #333;margin:5px 0}
button{padding:12px;border-radius:10px;border:none;font-weight:bold}
#playerWrap{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000ee;z-index:999;justify-content:center;align-items:center;flex-direction:column;padding:10px}
#playerBox{width:100%;max-width:700px;background:#111;border-radius:14px;overflow:hidden;border:2px solid #ffcc00;position:relative}
#playerBox iframe,#playerBox video{width:100%;height:400px;border:none;background:#000}
.topPlayer{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#222}
.item{display:flex;justify-content:space-between;align-items:center;background:#1e1e1e;padding:10px;border-radius:10px;margin:6px 0}
</style>
</head>
<body>
<header><a href="index.html">⬅️ Voltar</a><b>📺 TV Gratidão - Dentro</b><button onclick="fechar()" style="background:#ff4444;color:#fff">✕ Fechar</button></header>

<div class="box">
<b>Cola o link aqui (YouTube, Facebook, Instagram, TikTok, MP4, Drive, etc):</b>
<input id="link" placeholder="Ex: https://youtube.com/watch?v=... ou link direto .mp4">
<button onclick="assistir()" style="width:100%;background:#ffcc00;color:#000;margin-top:8px">▶️ Assistir DENTRO do App</button>
<small style="opacity:.5;display:block;margin-top:6px">Não sai do app. Abre telinha flutuante dentro.</small>
</div>

<div id="playerWrap">
<div id="playerBox">
<div class="topPlayer"><span id="tituloPlayer">Assistindo...</span><button onclick="fechar()" style="background:#ff4444;color:#fff;padding:6px 10px">✕</button></div>
<div id="areaPlayer"></div>
</div>
<button onclick="fechar()" style="margin-top:15px;background:#222;color:#fff;width:100%;max-width:700px">Fechar Player</button>
</div>

<div class="box"><b>🕘 Histórico</b><div id="hist"></div></div>

<script>
let historico=JSON.parse(localStorage.getItem('tv_dentro_v5')||'[]');

function getEmbed(url){
  url=url.trim();
  // YOUTUBE
  if(url.includes('youtube.com')||url.includes('youtu.be')){
    let id=url.match(/(?:v=|youtu.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
    if(id) return `<iframe src="https://www.youtube.com/embed/${id[1]}?autoplay=1" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
  }
  // VIMEO
  if(url.includes('vimeo.com')){
    let id=url.split('/').pop();
    return `<iframe src="https://player.vimeo.com/video/${id}?autoplay=1" allowfullscreen></iframe>`;
  }
  // MP4 / WEBM / M3U8 direto
  if(url.match(/\.(mp4|webm|ogg|m3u8)(\?|$)/i)){
    return `<video controls autoplay playsinline src="${url}"></video>`;
  }
  // DRIVE
  if(url.includes('drive.google.com')){
    let id=url.match(/\/d\/(.*?)\//);
    if(id) return `<iframe src="https://drive.google.com/file/d/${id[1]}/preview" allowfullscreen></iframe>`;
  }
  // TIKTOK, FACEBOOK, INSTA, OUTROS -> tenta iframe direto
  return `<iframe src="${url}" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
}

function assistir(){
 let url=document.getElementById('link').value.trim();
 if(!url) return alert('Cola o link');
 let embed=getEmbed(url);
 document.getElementById('areaPlayer').innerHTML=embed;
 document.getElementById('playerWrap').style.display='flex';
 document.getElementById('tituloPlayer').innerText=url.slice(0,40)+'...';
 // salva histórico
 historico.unshift({url,data:new Date().toLocaleString()});
 historico=historico.slice(0,20);
 localStorage.setItem('tv_dentro_v5',JSON.stringify(historico));
 renderHist();
}

function fechar(){
 document.getElementById('playerWrap').style.display='none';
 document.getElementById('areaPlayer').innerHTML='';
}

function renderHist(){
 let h=document.getElementById('hist');
 h.innerHTML=historico.map((it,i)=>`<div class="item"><div style="flex:1;overflow:hidden"><b style="font-size:12px">${it.url.slice(0,50)}</b><br><small style="opacity:.5">${it.data}</small></div><div style="display:flex;gap:5px"><button onclick="document.getElementById('link').value='${it.url}';assistir()" style="background:#ffcc00;color:#000">▶️</button><button onclick="delHist(${i})" style="background:#ff4444;color:#fff">🗑️</button></div></div>`).join('')||'<center style="opacity:.4">Nenhum vídeo ainda</center>';
}

function delHist(i){historico.splice(i,1);localStorage.setItem('tv_dentro_v5',JSON.stringify(historico));renderHist();}
renderHist();

// fechar com ESC
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
</script>
</body>
</html>
