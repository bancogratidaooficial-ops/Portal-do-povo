<body>
<h2>💬 MENSAGENS DIÁRIAS - IA ATUALIZA</h2>

<div class="ia-box">
<span style="color:#FFD700">🤖 IA ATIVA</span><br><small id="infoIA" style="color:#aaa">Gerando mensagens novas todo dia...</small><br>
<button class="azul" onclick="gerarIA()" style="margin-top:6px;width:auto">✨ GERAR 5 MENSAGENS NOVAS COM IA</button>
</div>

<select id="periodo"><option value="manha">🌅 Manhã</option><option value="tarde">🌞 Tarde</option><option value="noite">🌙 Noite</option><option value="gratidao">💛 Gratidão</option><option value="motivacao">🔥 Motivação</option><option value="esperanca">🙏 Esperança</option></select>
<textarea id="nova" placeholder="Escreva sua mensagem..."></textarea>
<div style="display:flex;gap:5px">
<button class="preto" onclick="document.getElementById('audioFile').click()" style="flex:1">🎤 Add Áudio Celular</button>
<button class="preto" onclick="document.getElementById('txtFile').click()" style="flex:1">📄 Add Texto Celular</button>
</div>
<input type="file" id="audioFile" accept="audio/*" style="display:none">
<input type="file" id="txtFile" accept=".txt,.json" style="display:none">
<button class="amarelo" onclick="addMsg()">➕ SALVAR MENSAGEM</button>

<div class="alarme-box">
<strong style="color:#FFD700">⏰ ALARME COM ÁUDIO ADICIONADO</strong>
<div style="display:flex;gap:5px;margin-top:5px"><input type="time" id="horaAlarme" style="flex:1"><select id="alarmeMsg" style="flex:2"></select></div>
<div style="display:flex;gap:5px"><button class="azul" onclick="setAlarme()" style="flex:1">🔔 ATIVAR ALARME</button><button class="preto" onclick="pararAlarme()" style="flex:1">⏹️ Parar</button></div>
<small id="statusAlarme" style="color:#aaa">Nenhum alarme ativo</small><audio id="playerAlarme" controls style="width:100%;margin-top:5px;display:none"></audio>
</div>

<div class="filtros" id="filtros">
<button class="preto ativo" onclick="filtrar('todas')">Todas</button>
<button class="preto" onclick="filtrar('manha')">🌅 Manhã</button>
<button class="preto" onclick="filtrar('tarde')">🌞 Tarde</button>
<button class="preto" onclick="filtrar('noite')">🌙 Noite</button>
<button class="preto" onclick="filtrar('gratidao')">💛 Gratidão</button>
<button class="preto" onclick="filtrar('motivacao')">🔥 Motivação</button>
<button class="preto" onclick="filtrar('esperanca')">🙏 Esperança</button>
</div>

<div id="lista"></div>
<hr style="opacity:0.2">
<button class="preto" onclick="backup()" style="width:100%">💾 BACKUP (buckcap)</button>
<input type="file" id="rest" style="display:none" onchange="restaurar(event)">
<button class="preto" onclick="document.getElementById('rest').click()" style="width:100%">♻️ RESTAURAR</button>
<button class="preto" onclick="resetar()" style="width:100%;background:#500;color:#fff">🗑️ RESETAR TUDO</button>
<a href="index.html" style="color:#FFD700;display:block;text-align:center;margin:12px">◀️ VOLTAR PRO PORTAL</a>
