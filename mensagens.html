<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mensagens Diárias - Portal do Povo</title>

<body>
<h2>💬 MENSAGENS DIÁRIAS - Portal do Povo</h2>

<select id="periodo"><option value="manha">🌅 Manhã</option><option value="tarde">🌞 Tarde</option><option value="noite">🌙 Noite</option><option value="gratidao" selected>💛 Gratidão</option><option value="motivacao">🔥 Motivação</option><option value="esperanca">🙏 Esperança</option></select>
<textarea id="nova" placeholder="Escreva sua mensagem... ex: Bom dia! Gratidão gera prosperidade"></textarea>

<div style="display:flex;gap:5px">
<button class="preto" onclick="document.getElementById('audioFile').click()" style="flex:1">🎤 Add Áudio do Celular</button>
<button class="preto" onclick="document.getElementById('txtFile').click()" style="flex:1">📄 Add Texto do Celular</button>
</div>
<input type="file" id="audioFile" accept="audio/*" style="display:none">
<input type="file" id="txtFile" accept=".txt,.json" style="display:none">

<button class="amarelo" onclick="addMsg()">➕ SALVAR MENSAGEM</button>

<div class="alarme-box">
<strong style="color:#FFD700">⏰ ALARME COM ÁUDIO</strong>
<div style="display:flex;gap:5px;margin-top:5px"><input type="time" id="horaAlarme" style="flex:1"><select id="alarmeMsg" style="flex:2"></select></div>
<div style="display:flex;gap:5px"><button class="azul" onclick="setAlarme()" style="flex:1">🔔 ATIVAR ALARME</button><button class="preto" onclick="pararAlarme()" style="flex:1">⏹️ Parar</button></div>
<small id="statusAlarme" style="color:#aaa">Nenhum alarme ativo</small>
