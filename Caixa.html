<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caixa</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}header{display:flex;justify-content:space-between;background:#111;padding:12px;border-radius:12px;border:1px solid #ffcc00;margin-bottom:10px}a{color:#ffcc00;text-decoration:none;font-weight:bold}.box{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:10px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;margin:5px 0}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:bold}.item{display:flex;justify-content:space-between;background:#1e1e1e;padding:10px;border-radius:8px;margin:5px 0}.total{text-align:center;font-size:22px;color:#00ff88}</style></head><body>
<header><a href="index.html">⬅️ Voltar</a><h3>💰 Caixa Diário</h3><span id="data"></span></header>
<div class="box"><div class="total">R$ <span id="total">0.00</span></div><input id="desc" placeholder="Descrição ex: Estacionamento ABC1234"><input id="valor" type="number" placeholder="Valor R$"><button class="btn" style="background:#00ff88" onclick="add()">+ Adicionar Venda</button></div>
<div class="box" id="lista"></div>
<script>
let vendas=JSON.parse(localStorage.getItem('caixa')||'[]');
document.getElementById('data').innerText=new Date().toLocaleDateString('pt-BR');
function add(){let d=document.getElementById('desc').value,v=parseFloat(document.getElementById('valor').value);if(!d||!v)return alert('Preenche!');vendas.unshift({id:Date.now(),desc:d,valor:v,hora:new Date().toLocaleTimeString()});localStorage.setItem('caixa',JSON.stringify(vendas));render();document.getElementById('desc').value='';document.getElementById('valor').value='';}
function del(id){if(confirm('Apagar?')){vendas=vendas.filter(x=>x.id!=id);localStorage.setItem('caixa',JSON.stringify(vendas));render();}}
function render(){let tot=0;let h='';vendas.forEach(v=>{tot+=v.valor;h+=`<div class="item"><div><b>${v.desc}</b><br><small>${v.hora} - R$ ${v.valor.toFixed(2)}</small></div><button onclick="del(${v.id})" style="background:#ff4444;color:#fff;border:none;padding:6px;border-radius:6px">🗑️</button></div>`});document.getElementById('lista').innerHTML=h||'Nenhuma venda';document.getElementById('total').innerText=tot.toFixed(2);}
render();
</script></body></html>
