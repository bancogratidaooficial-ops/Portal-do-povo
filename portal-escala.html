<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;padding:10px;background:#f0f0f0}
.box{background:#fff;padding:15px;border-radius:10px;max-width:900px;margin:auto}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:14px;margin:5px 0;border:0;border-radius:6px;color:#fff;font-weight:bold}
.verde{background:green}.azul{background:#1F4E79}.cinza{background:gray}.vermelho{background:red}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
th{background:#1F4E79;color:#fff;padding:5px}
td{border:1px solid #ccc;padding:4px;text-align:center}
.T{background:#C6EFCE}.F{background:#FFC7CE}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center">ESCALA 5x1 - FINAL</h2>
<input id="nome" placeholder="Nome">
<input id="hor" placeholder="Horario ex: 10:00-18:20">
<select id="tipo"><option value="5x1">5x1 AUTOMATICO</option><option value="encarregado">ENCARREGADO - Folga Sab Dom</option></select>
<button class="verde" onclick="add()">ADICIONAR</button>
<select id="mes"><option value="9">SETEMBRO</option><option value="10" selected>OUTUBRO</option><option value="11">NOVEMBRO</option></select>
<button class="azul" onclick="gerar()">GERAR ESCALA</button>
<div id="lista" style="background:#eee;padding:8px;margin:8px 0"></div>
<div style="overflow:auto"><table id="tab"></table></div>
<button class="cinza" onclick="exemplo()">CARREGAR MINHA EQUIPE 5x1</button>
<button class="azul" onclick="window.print()">IMPRIMIR PDF</button>
<button class="vermelho" onclick="limpar()">LIMPAR</button>
</div>
<script>
var funcionarios=[];
function add(){var n=document.getElementById('nome').value;var h=document.getElementById('hor').value;var t=document.getElementById('tipo').value;if(n==""){alert("Digite nome");return}funcionarios.push({nome:n,hor:h,tipo:t,offset:funcionarios.length});document.getElementById('nome').value="";document.getElementById('hor').value="";lista();gerar();}
function lista(){var d=document.getElementById('lista');if(funcionarios.length==0)d.innerHTML="Nenhum";else{var t="Adicionados: "+funcionarios.length+"<br>";for(var i=0;i<funcionarios.length;i++){t+=(i+1)+". "+funcionarios[i].nome+" "+funcionarios[i].hor+" <a href='#' onclick='rem("+i+")'>[X]</a><br>"}d.innerHTML=t}}
function rem(i){funcionarios.splice(i,1);for(var k=0;k<funcionarios.length;k++)funcionarios[k].offset=k;lista();gerar();}
function limpar(){funcionarios=[];lista();gerar();}
function exemplo(){funcionarios=[{nome:"Natal",hor:"15:20-22:40",tipo:"5x1",offset:0},{nome:"Kaue",hor:"07:00-15:20",tipo:"5x1",offset:1},{nome:"Mario",hor:"22:40-07:00",tipo:"5x1",offset:2},{nome:"Jose Marcos",hor:"10:00-18:20",tipo:"5x1",offset:3},{nome:"Alechandre",hor:"22:40-07:00",tipo:"5x1",offset:4},{nome:"Celio Encarregado",hor:"11:00-19:40",tipo:"encarregado",offset:5}];lista();gerar();}
function gerar(){var mes=parseInt(document.getElementById('mes').value);var ano=2026;var dias=new Date(ano,mes,0).getDate();var tab=document.getElementById('tab');if(funcionarios.length==0){tab.innerHTML="<tr><td>Adicione funcionario</td></tr>";return}var dsem=["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];var h="<tr><th>Nome</th><th>Horario</th>";for(var d=1;d<=dias;d++){var dt=new Date(ano,mes-1,d);h+="<th>"+d+"/"+mes+"<br>"+dsem[dt.getDay()]+"</th>"}h+="</tr>";for(var f=0;f<funcionarios.length;f++){var fun=funcionarios[f];h+="<tr><td><b>"+fun.nome+"</b></td><td>"+fun.hor+"</td>";for(var d=1;d<=dias;d++){var dt=new Date(ano,mes-1,d);var wd=dt.getDay();if(fun.tipo=="encarregado"){if(wd==0||wd==6)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>"}else{if((d+fun.offset)%6==0)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>"}}h+="</tr>"}tab.innerHTML=h;}
</script>
</body>
</html>
