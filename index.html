<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f6f6;color:#222;line-height:1.6}
header{background:#0d0d0d;color:#FFD700;padding:20px;text-align:center;position:sticky;top:0;z-index:99}
header h1{margin:0;font-size:22px;letter-spacing:1px}
header p{margin:4px 0;color:#fff;font-size:13px}
nav{margin-top:10px}
nav a{color:#FFD700;text-decoration:none;margin:3px;border:1px solid #FFD700;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:bold;display:inline-block}
.hero{max-width:1000px;margin:15px auto;background:#fff;padding:22px;border-radius:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px;margin:0 auto;padding:0 15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:6px solid #FFD700}
.card h2{margin:0 0 6px;font-size:17px}
.card small{color:#777;font-size:11px}
.card p{font-size:13px;color:#444}
.btn{display:inline-block;background:#111;color:#FFD700;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:12px;margin:5px 3px 0 0}
.btn-gold{background:#FFD700;color:#000}
.box{max-width:1000px;margin:15px auto;background:#fff;padding:20px;border-radius:14px}
footer{background:#0d0d0d;color:#aaa;text-align:center;padding:20px;font-size:12px;margin-top:20px}
h3{color:#111}
</style>
</head>
