<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal do Povo V2 - Completo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:10px;padding-bottom:80px}
header{text-align:center;padding:15px;background:#111;border:2px solid #ffcc00;border-radius:14px;margin-bottom:10px}
h1{color:#ffcc00;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1a1a1a;border-radius:14px;padding:14px;text-align:center;position:relative;border:1px solid #222}
.card button.lixo{position:absolute;top:6px;right:6px;background:#ff4444;color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px}
.app-btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:bold;font-size:14px;margin-top:8px}
.topBtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.topBtns button{padding:8px 10px;border-radius:8px;border:none;font-weight:bold;font-size:12px}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;padding:12px;overflow:auto}
.box{background:#111;border:1px solid #ffcc00;border-radius:12px;padding:12px;margin:8px 0}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;margin:4px 0}
.item{display:flex;justify-content:space-between;align-items:center;background:#222;padding:10px;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<header>
<h1>📋 MEU PORTAL</h1>
<div class="topBtns">
<button onclick="novoApp()" style="background:#00ff88">+ NOVO APP</button>
<button onclick="compartilhar()" style="background:#00aaff;color:#fff">📤 Compartilhar</button>
<button onclick="convidar()" style="background:#ffcc00">👥 Convidar</button>
<button onclick="backup()" style="background:#8888ff;color:#fff">💾 Backup</button>
<button onclick="document.getElementById('fileRest').click()" style="background:#ff8800;color:#fff">♻️ Restaurar</button>
<button onclick="resetar()" style="background:#ff4444;color:#fff">🗑️ Reset</button>
</div>
<input type="file" id="fileRest" style="display:none" onchange="restaurar(this)">
</header>

<div class="grid" id="grid"></div>

<div id="modal">
<div style="display:flex;justify-content:space-between"><h2 style="color:#ffcc00">📋 DÍVIDAS</h2><button onclick="fechar()" style="background:#ff4444;color:#fff;border:none;padding:8px 12px;border-radius:8px">⬅️ Voltar</button></div>
<div class="box"><div style="text-align:center;font-size:20px;color:#ffcc00">Total: R$ <span id="total">0.00</span></div><input id="nome" placeholder="Quem deve?"><input id="valor" type="number" placeholder="Valor R$"><input id="data" type="date"><button onclick="addDiv()" style="width:100%;padding:12px;background:#ffcc00;border:none;border-radius:10px;font-weight:bold">+ Adicionar</button></div>
<div class="box" id="lista"></div>
</div>

<script>
let apps = JSON.parse(localStorage.getItem('portal_apps')||'null');
if(!apps){apps=[{id:1,nome:"📋 DÍVIDAS",tipo:"dividas",cor:"#ffcc00"},{id:2,nome:"🏦 Bancos",file:"bancos.html",cor:"#222"},{id:3,nome:"💸 Gastos",file:"gastos.html",cor:"#222"},{id:4,nome:"💬 Mensagens",file:"mensagens.html",cor:"#222"}];}

let dividas = JSON.parse(localStorage.getItem('dividas_v2')||'[]');

function render(){
let g=document.getElementById('grid');g.innerHTML='';
apps.forEach(a=>{
let html=`<div class="card"><button class="lixo" onclick="delApp(${a.id})">🗑️</button><div style="font-size:30px">${a.nome.split(' ')[0]}</div><div style="font-weight:bold;margin:6px 0">${a.nome}</div>`;
if(a.tipo=='dividas'){html+=`<button class="app-btn" style="background:${a.cor}" onclick="abrir()">Abrir</button>`}else{html+=`<button class="app-btn" style="background:${a.cor};color:#fff" onclick="location.href='${a.file}'">Abrir</button><small style="opacity:.5">${a.file}</small>`}
html+=`</div>`;g.innerHTML+=html;
});localStorage.setItem('portal_apps',JSON.stringify(apps));
}
function novoApp(){let nome=prompt("Nome do App? Ex: 🎵 Músicas");if(!nome)return;let file=prompt("Arquivo? Ex: musicas.html (ou deixa vazio se for só atalho)");if(file===null)return;apps.push({id:Date.now(),nome,file:file||"#",cor:"#222"});render();}
function delApp(id){if(confirm("Apagar esse app?")){apps=apps.filter(a=>a.id!=id);render();}}
function abrir(){document.getElementById('modal').style.display='block';renderDiv();}
function fechar(){document.getElementById('modal').style.display='none';}
function addDiv(){let n=document.getElementById('nome').value,v=parseFloat(document.getElementById('valor').value),d=document.getElementById('data').value;if(!n||!v)return alert('Preenche!');dividas.push({id:Date.now(),nome:n,valor:v,data:d||new Date().toLocaleDateString(),pago:false});salvar();}
function pagar(id){dividas=dividas.map(x=>x.id==id?{...x,pago:!x.pago}:x);salvar();}
function delDiv(id){if(confirm('Apagar dívida?')){dividas=dividas.filter(x=>x.id!=id);salvar();}}
function salvar(){localStorage.setItem('dividas_v2',JSON.stringify(dividas));renderDiv();}
function renderDiv(){let tot=0;let h='';dividas.forEach(x=>{if(!x.pago)tot+=x.valor;h+=`<div class="item"><div><b>${x.nome}</b><br><small>R$ ${x.valor.toFixed(2)} - ${x.data}</small></div><div><button onclick="pagar(${x.id})" style="background:${x.pago?'#00ff88':'#ffcc00'};border:none;padding:6px;border-radius:6px">${x.pago?'Pago':'Pagar'}</button> <button onclick="delDiv(${x.id})" style="background:#ff4444;color:#fff;border:none;padding:6px;border-radius:6px">🗑️</button></div></div>`});document.getElementById('lista').innerHTML=h||'Nenhuma';document.getElementById('total').innerText=tot.toFixed(2);}
function compartilhar(){if(navigator.share){navigator.share({title:'Meu Portal',url:location.href})}else{prompt('Copia o link:',location.href)}}
function convidar(){let link=location.href;let msg=`Entra no meu Portal do Povo V2: ${link}`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);}
function backup(){let dados={apps,dividas};let blob=new Blob([JSON.stringify(dados)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-portal.json';a.click();}
function restaurar(input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=e=>{try{let d=JSON.parse(e.target.result);apps=d.apps||apps;dividas=d.dividas||dividas;localStorage.setItem('portal_apps',JSON.stringify(apps));localStorage.setItem('dividas_v2',JSON.stringify(dividas));render();alert('Restaurado!')}catch{alert('Arquivo inválido')}};r.readAsText(file);}
function resetar(){if(confirm('APAGAR TUDO mesmo? Dívidas e apps?')){localStorage.clear();location.reload();}}
render();
</script>
</body>
</html>
