<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Portal - Definitivo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}
header{text-align:center;padding:15px;background:#111;border:2px solid #ffcc00;border-radius:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1a1a1a;border-radius:14px;padding:14px;text-align:center;position:relative;border:1px solid #222;min-height:140px}
.card.lixo{position:absolute;top:6px;right:6px;background:#ff4444;color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:14px}
.app-btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:bold;margin-top:8px}
.topBtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.topBtns button{padding:10px 12px;border-radius:10px;border:none;font-weight:bold;font-size:13px}
</style>
</head>
<body>
<header>
<h1 style="color:#ffcc00;margin:0">📋 MEU PORTAL</h1>
<div class="topBtns">
<button onclick="novoApp()" style="background:#00ff88;color:#000">+ NOVO APP</button>
<button onclick="compartilhar()" style="background:#00aaff;color:#fff">📤 Compartilhar</button>
<button onclick="convidar()" style="background:#ffcc00;color:#000">👥 Convidar</button>
<button onclick="backup()" style="background:#8888ff;color:#fff">💾 Backup</button>
<button onclick="document.getElementById('file').click()" style="background:#fff;color:#000">♻️ Restaurar</button>
<input type="file" id="file" style="display:none" onchange="restaurar(this)">
</div>
</header>
<div class="grid" id="grid"></div>

<script>
// APPS QUE NUNCA SOMEM - FIXOS NO CÓDIGO
const FIXOS = [
 {nome:"📋 DÍVIDAS",file:"dividas.html",cor:"#ffcc00",txt:"#000"},
 {nome:"🏦 Bancos",file:"bancos.html"},
 {nome:"💸 Gastos",file:"gastos.html"},
 {nome:"💬 Mensagens",file:"mensagens.html"},
 {nome:"🎵 Musicas",file:"musicas.html"},
 {nome:"🎬 Videos",file:"video.html"},
 {nome:"📱 Redes",file:"redes.html"},
 {nome:"✂️ Tesoura",file:"tesoura.html"},
 {nome:"🗺️ Mapas",file:"mapas.html"},
 {nome:"🅿️ Estacionamento",file:"estacionamento.html"},
 {nome:"💰 Caixa",file:"caixa.html"},
 {nome:"📦 Estoque",file:"estoque.html"},
 {nome:"🛒 Mercado",file:"mercado.html"},
 {nome:"📦 Controle",file:"controle.html"},
];

function getExtras(){return JSON.parse(localStorage.getItem('portal_v4')||'[]');}
function setExtras(e){localStorage.setItem('portal_v4',JSON.stringify(e));}

function render(){
 let extras=getExtras();
 let todos=[...FIXOS.map((f,i)=>({...f,id:i,fixo:true})),...extras];
 let g=document.getElementById('grid');g.innerHTML='';
 todos.forEach(a=>{
   g.innerHTML+=`<div class="card">
   ${!a.fixo?`<button class="lixo" onclick="del(${a.id})">🗑️</button>`:''}
   <div style="font-size:32px;margin-top:${!a.fixo?10:0}px">${a.nome.split(' ')[0]}</div>
   <div style="font-weight:bold;margin:6px 0">${a.nome}</div>
   <button class="app-btn" style="background:${a.cor||'#222'};color:${a.txt||'#fff'}" onclick="location.href='${a.file}'">Abrir</button>
   <small style="opacity:.4;font-size:10px">${a.file}</small></div>`;
 });
}

function novoApp(){
 let nome=prompt("Nome do app: ex: 📝 Notas");
 if(!nome)return;
 let file=prompt("Nome do arquivo: ex: notas.html (tem que ser minúsculo e existir)");
 if(!file)return;
 let extras=getExtras();
 extras.push({id:Date.now(),nome,file,fixo:false});
 setExtras(extras);
 render();
}

function del(id){
 if(confirm('Apagar esse app? Só apaga do portal, não apaga o arquivo.')){
   let extras=getExtras().filter(x=>x.id!=id);
   setExtras(extras);
   render();
 }
}

function backup(){
 let dados={fixos:FIXOS,extras:getExtras(),data:new Date().toLocaleString()};
 let blob=new Blob([JSON.stringify(dados)],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-portal.json';a.click();
}

function restaurar(input){
 let file=input.files[0];if(!file)return;
 let r=new FileReader();r.onload=e=>{
   try{let d=JSON.parse(e.target.result);if(d.extras){setExtras(d.extras);render();alert('Restaurado! '+d.extras.length+' apps recuperados');}else{alert('Backup inválido');}}catch(err){alert('Erro no arquivo')}
 };r.readAsText(file);
}

function compartilhar(){let url=location.href;if(navigator.share){navigator.share({title:'Meu Portal',url})}else{prompt('Copie o link:',url)}}
function convidar(){window.open('https://wa.me/?text='+encodeURIComponent('Acessa meu Portal: '+location.href))}

render();
</script>
</body>
</html>
