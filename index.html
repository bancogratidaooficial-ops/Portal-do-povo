<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caixa</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}header{display:flex;justify-content:space-between;background:#111;padding:12px;border-radius:12px;border:1px solid #ffcc00;margin-bottom:10px}a{color:#ffcc00;text-decoration:none;font-weight:bold}.box{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:10px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;margin:5px 0}.item{display:flex;justify-content:space-between;background:#1e1e1e;padding:10px;border-radius:8px;margin:5px 0;align-items:center}.total{text-align:center;font-size:26px;color:#00ff88;font-weight:bold}</style></head><body>
<header><a href="index.html">⬅️ Voltar</a><h3>💰 Caixa Diário</h3><button onclick="if(confirm('Zerar tudo do dia?')){vendas=[];localStorage.setItem('caixa',JSON.stringify(vendas));render();}" style="background:#ff4444;color:#fff;border:none;padding:6px 10px;border-radius:8px">🗑️ Zerar</button></header>
<div class="box"><div class="total">R$ <span id="total">0.00</span> <small style="font-size:12px;color:#fff" id="qtd">0 vendas</small></div><input id="desc" placeholder="O que vendeu? ex: Lavagem carro"><input id="valor" type="number" inputmode="decimal" placeholder="Valor R$"><button onclick="add()" style="width:100%;padding:12px;border-radius:10px;border:none;background:#00ff88;font-weight:bold;margin-top:6px">+ Adicionar Venda</button></div>
<div class="box" id="lista"></div>
<script>
let vendas=JSON.parse(localStorage.getItem('caixa')||'[]');
function add(){let d=document.getElementById('desc').value,v=parseFloat(document.getElementById('valor').value);if(!d||!v)return alert('Preenche nome e valor');vendas.unshift({id:Date.now(),desc:d,valor:v,hora:new Date().toLocaleTimeString()+' '+new Date().toLocaleDateString()});localStorage.setItem('caixa',JSON.stringify(vendas));render();document.getElementById('desc').value='';document.getElementById('valor').value='';document.getElementById('desc').focus();}
function del(id){if(confirm('Apagar essa venda? 🗑️')){vendas=vendas.filter(x=>x.id!=id);localStorage.setItem('caixa',JSON.stringify(vendas));render();}}
function render(){let tot=0;let h='';vendas.forEach(v=>{tot+=v.valor;h+=`<div class="item"><div><b>${v.desc}</b><br><small>${v.hora} - R$ ${v.valor.toFixed(2)}</small></div><button onclick="del(${v.id})" style="background:#ff4444;color:#fff;border:none;padding:8px 12px;border-radius:8px">🗑️</button></div>`});document.getElementById('lista').innerHTML=h||'<center style="opacity:.4">Nenhuma venda hoje</center>';document.getElementById('total').innerText=tot.toFixed(2);document.getElementById('qtd').innerText=`${vendas.length} vendas`;}
render();
document.getElementById('valor').addEventListener('keydown',e=>{if(e.key==='Enter')add();});
</script></body></html>
