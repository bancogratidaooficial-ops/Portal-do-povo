<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco Gratidão</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#080808;color:#fff}
header{background:#000;border-bottom:3px solid #ffcc00;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
h1{color:#ffcc00;font-size:22px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:14px;text-align:center;text-decoration:none;color:#fff;display:block;position:relative}
.card b{color:#ffcc00;display:block;margin-top:5px;font-size:12px} .card small{color:#aaa;font-size:10px} .icon{font-size:28px}
.destaque{border:2px solid #ffcc00;background:#1a1500;grid-column:span 2}
.btnAdd{grid-column:span 2;background:#000;border:2px dashed #ffcc00;color:#ffcc00;padding:16px;border-radius:14px;font-weight:900}
#btnInstalar{display:none;background:#ffcc00;color:#000;border:none;padding:12px;width:90%;margin:12px auto;border-radius:10px;font-weight:900;position:fixed;bottom:10px;left:5%;z-index:99}
.x{position:absolute;top:5px;right:8px;background:#ff2222;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px}
</style></head><body>
<header><h1>BANCO GRATIDÃO OFICIAL</h1><p style="color:#aaa;font-size:11px">Portal do Povo - Tudo em um só lugar</p></header>

<div class="grid" id="grid">
<!-- Fixos -->
<a href="estacionamento/index.html" class="card destaque"><div class="icon">🅿️</div><b>ESTACIONAMENTO COM CÂMERA</b><small>R$10 / R$18 / R$40 / R$50</small></a>
<a href="filmes/index.html" class="card"><div class="icon">🎬</div><b>FILMES / GRATIFLIX</b></a>
<a href="matérias/index.html" class="card"><div class="icon">📚</div><b>MATÉRIAS / CURSOS</b></a>
<a href="viagens-tempo/index.html" class="card"><div class="icon">⏳</div><b>VIAGENS NO TEMPO</b></a>
<a href="bancos.html" class="card"><div class="icon">🏦</div><b>BANCOS</b></a>
<a href="caixa.html" class="card"><div class="icon">💰</div><b>CAIXA</b></a>
<a href="estoque.html" class="card"><div class="icon">📦</div><b>ESTOQUE</b></a>
<a href="gastos.html" class="card"><div class="icon">📉</div><b>GASTOS</b></a>

<button class="btnAdd" onclick="adicionar()">➕ ADICIONAR ARQUIVO / APLICATIVO</button>
</div>

<button id="btnInstalar">📲 ADICIONAR APP NA TELA INICIAL</button>

<script>
// CARREGA APPS ADICIONADOS
let apps = JSON.parse(localStorage.getItem('meus_apps')||'[]');
const grid = document.getElementById('grid');

function renderCustom(){
 document.querySelectorAll('.custom').forEach(e=>e.remove());
 apps.forEach((a,i)=>{
   let el=document.createElement('a');
   el.href=a.link; el.className='card custom';
   el.innerHTML=`<button class="x" onclick="remover(event,${i})">X</button><div class="icon">${a.icone}</div><b>${a.nome.toUpperCase()}</b><small>${a.link}</small>`;
   grid.insertBefore(el, grid.lastElementChild);
 });
}
function adicionar(){
 let nome=prompt('Nome do app/arquivo que você inseriu?\nEx: PRIVACIDADE');
 if(!nome) return;
 let link=prompt('Qual o nome do arquivo no GitHub?\nEx: privacidade.html ou pasta/arquivo.html');
 if(!link) return;
 let icone=prompt('Escolhe um ícone (emoji):\nEx: 📄 🔒 📷','📄')||'📄';
 apps.push({nome,link,icone});
 localStorage.setItem('meus_apps',JSON.stringify(apps));
 renderCustom();
}
function remover(e,i){
 e.preventDefault(); e.stopPropagation();
 if(confirm('Remover este app?')){apps.splice(i,1); localStorage.setItem('meus_apps',JSON.stringify(apps)); renderCustom();}
}
renderCustom();

// BOTÃO INSTALAR PWA
let deferredPrompt; const btn=document.getElementById('btnInstalar');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault(); deferredPrompt=e; btn.style.display='block';});
btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt(); await deferredPrompt.userChoice; btn.style.display='none'; deferredPrompt=null;}});
</script>
</body></html>
