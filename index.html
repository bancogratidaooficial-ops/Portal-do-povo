<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEU PORTAL - BANCO GRATIDÃO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial;padding:10px}
header{border:2px solid #ffcc00;border-radius:16px;padding:15px;text-align:center;background:#111;margin-bottom:12px}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.b1{background:#00ff88;color:#000}.b2{background:#0099ff;color:#fff}.b3{background:#ffcc00;color:#000}
.b4{background:#aa88ff;color:#000}.b5{background:#fff;color:#000}.b6{background:#ff4444;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#151515;border:1px solid #222;border-radius:12px;padding:12px;text-align:center}
.card b{display:block;margin:6px 0;color:#ffcc00}
.abrir{width:100%;padding:10px;border-radius:8px;border:none;background:#ffcc00;font-weight:bold;cursor:pointer}
.link{font-size:11px;opacity:.4}
footer{text-align:center;padding:20px;font-size:12px;opacity:.6}
footer a{color:#ffcc00;text-decoration:none;margin:0 6px}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:99}
#modal div{background:#222;padding:20px;border-radius:12px;width:90%;max-width:350px}
#modal input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none}
</style>
</head><body>
<header>
<h1 style="margin:0;color:#ffcc00">📋 MEU PORTAL - BANCO GRATIDÃO</h1>
<small>bancogratidaooficial-ops.github.io</small>
<div class="top">
<button class="btn b1" onclick="abrirModal()">+ NOVO APP</button>
<button class="btn b2" onclick="compartilhar()">📤 Compartilhar</button>
<button class="btn b3" onclick="convidar()">👥 Convidar</button>
<button class="btn b4" onclick="backup()">💾 Backup</button>
<button class="btn b5" onclick="document.getElementById('file').click()">♻️ Restaurar</button>
<button class="btn b6" onclick="resetar()">🧹 Reset</button>
<input type="file" id="file" style="display:none" onchange="restaurar(this)">
</div>
</header>

<div class="grid" id="grid">
<div class="card">📋<b>DÍVIDAS</b><button class="abrir" onclick="location.href='dividas.html'">Abrir</button><div class="link">dividas.html</div></div>
<div class="card">🏦<b>Bancos</b><button class="abrir" onclick="location.href='bancos.html'">Abrir</button><div class="link">bancos.html</div></div>
<div class="card">💸<b>Gastos</b><button class="abrir" onclick="location.href='gastos.html'">Abrir</button></div>
<div class="card">💬<b>Mensagens</b><button class="abrir" onclick="location.href='mensagens.html'">Abrir</button></div>
<div class="card">🎵<b>Musicas</b><button class="abrir" onclick="location.href='musicas.html'">Abrir</button></div>
<div class="card">🎬<b>Videos</b><button class="abrir" onclick="location.href='video.html'">Abrir</button></div>
<!-- SEUS OUTROS 25 APPS CONTINUAM AQUI, NÃO APAGA -->
</div>

<a href="viagens-tempo/index.html" style="display:block;background:linear-gradient(90deg,#ffcc00,#ff6600);color:#000;text-align:center;padding:16px;border-radius:12px;font-weight:bold;margin:15px 0;text-decoration:none">🕰️ NOVA PASTA: VIAGENS NO TEMPO - VER TUDO</a>

<footer>
<a href="sobre.html">Sobre</a> | <a href="dicas.html">Dicas</a> | <a href="ajuda.html">Ajuda</a> | <a href="contato.html">Contato</a>
<p>Portal do Povo Curitiba - Banco Gratidão 2026</p>
</footer>

<div id="modal"><div>
<h3 style="color:#ffcc00;margin-top:0">Novo App</h3>
<input id="nome" placeholder="Nome ex: Netflix">
<input id="icone" placeholder="Emoji ex: 🎬">
<input id="link" placeholder="Arquivo ex: netflix.html">
<button onclick="salvarApp()" style="width:100%;padding:10px;background:#00ff88;border:none;border-radius:8px;font-weight:bold;margin-top:8px">Salvar</button>
<button onclick="fecharModal()" style="width:100%;padding:8px;background:#333;color:#fff;border:none;border-radius:8px;margin-top:6px">Cancelar</button>
</div></div>

<script>
function abrirModal(){document.getElementById('modal').style.display='flex'}
function fecharModal(){document.getElementById('modal').style.display='none'}
function salvarApp(){
 let n=document.getElementById('nome').value, i=document.getElementById('icone').value||'📱', l=document.getElementById('link').value;
 if(!n||!l){alert('Preencha nome e link');return}
 let html=`<div class="card">${i}<b>${n}</b><button class="abrir" onclick="location.href='${l}'">Abrir</button><div class="link">${l}</div></div>`;
 document.getElementById('grid').insertAdjacentHTML('beforeend',html);
 localStorage.setItem('portal_apps',document.getElementById('grid').innerHTML);
 fecharModal();
}
function compartilhar(){
 if(navigator.share){navigator.share({title:'Meu Portal',url:location.href})}
 else{prompt('Copie o link:',location.href)}
}
function convidar(){prompt('Copie e mande pros amigos:',location.href); }
function backup(){
 let dados=localStorage.getItem('portal_apps')||document.getElementById('grid').innerHTML;
 let blob=new Blob([dados],{type:'text/plain'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-portal.txt';a.click();
}
function restaurar(inp){
 let r=new FileReader();r.onload=function(){document.getElementById('grid').innerHTML=r.result;localStorage.setItem('portal_apps',r.result);alert('Restaurado!')};r.readAsText(inp.files[0]);
}
function resetar(){if(confirm('Apagar tudo e voltar ao padrão?')){localStorage.clear();location.reload();}}
(function(){let s=localStorage.getItem('portal_apps');if(s){document.getElementById('grid').innerHTML=s}})
();
</script>
</body></html>
