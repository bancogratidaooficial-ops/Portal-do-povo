<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f0f2f5;padding:8px}
.box{background:#fff;border-radius:12px;padding:12px;max-width:1100px;margin:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid #1F4E79;border-radius:10px;padding:10px;background:#f8faff;margin:8px 0}
label{font-size:12px;font-weight:bold;color:#1F4E79;display:block;margin-top:6px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-top:3px}
button{width:100%;padding:13px;border:0;border-radius:8px;color:#fff;font-weight:bold;margin:5px 0}
.v{background:#27ae60}.a{background:#1F4E79}.g{background:gray}.r{background:red}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px}
th{background:#1F4E79;color:#fff;padding:6px}
td{border:1px solid #ccc;padding:5px;text-align:center}
.T{background:#C6EFCE}.F{background:#FFC7CE;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center">ESCALA 5x1 - COMPLETA COM BOTOES</h2>
<div class="card">
<label>1 - NOME</label><input id="nome" placeholder="Ex: Jose Marcos">
<label>2 - HORARIO DE TRABALHO</label>
<div class="row"><input type="time" id="hin" value="10:00"><input type="time" id="hout" value="18:20"></div>
<label>3 - TIPO DE FOLGA</label>
<select id="tipo" onchange="trocaTipo()">
<option value="5x1">5x1 AUTOMATICO</option>
<option value="fixa">FOLGA FIXA - Escolher dia semana</option>
<option value="encarregado">ENCARREGADO - Folga Sab e Dom</option>
<option value="personal">PERSONALIZADA - Escolher dias do mes</option>
</select>
<div id="areaFixa" style="display:none"><label>DIA DA FOLGA FIXA</label><select id="diaSemana"><option>Segunda</option><option>Terca</option><option>Quarta</option><option>Quinta</option><option>Sexta</option><option>Sabado</option><option>Domingo</option></select></div>
<div id="area5x1"><label>QUANDO COMECA A FOLGA (pra nao folgar todos juntos)</label><select id="inicioFolga"><option value="0">Folga dia 06,12,18,24,30</option><option value="1">Folga dia 05,11,17,23,29</option><option value="2">Folga dia 04,10,16,22,28</option><option value="3">Folga dia 03,09,15,21,27</option><option value="4">Folga dia 02,08,14,20,26</option><option value="5">Folga dia 01,07,13,19,25,31</option></select></div>
<div id="areaPers" style="display:none"><label>DIGITE OS DIAS DO MES QUE FOLGA</label><input id="diasFolga" placeholder="Ex: 5,12,19,26"></div>
<button class="v" onclick="add()">+ ADICIONAR</button>
</div>
<div class="row"><div><label>MES</label><select id="mes"><option value="9">SETEMBRO</option><option value="10" selected>OUTUBRO</option><option value="11">NOVEMBRO</option></select></div><div><label>ANO</label><select id="ano"><option>2026</option></select></div></div>
<button class="a" onclick="gerar()">GERAR ESCALA AGORA</button>
<div id="lista" style="background:#eee;padding:8px;border-radius:8px;margin:6px 0"></div>
<div style="overflow:auto"><table id="tab"></table></div>
<button class="g" onclick="exemplo()">CARREGAR MINHA EQUIPE 5x1</button>
<button class="a" onclick="window.print()">IMPRIMIR PDF</button>
<button class="r" onclick="limpar()">LIMPAR TUDO</button>
</div>
<script>
var funcs=[];
function trocaTipo(){var t=document.getElementById('tipo').value;document.getElementById('areaFixa').style.display=t=='fixa'?'block':'none';document.getElementById('areaPers').style.display=t=='personal'?'block':'none';document.getElementById('area5x1').style.display=t=='5x1'?'block':'none';}
function add(){var nome=document.getElementById('nome').value;var hin=document.getElementById('hin').value;var hout=document.getElementById('hout').value;var hor=hin+'-'+hout;var tipo=document.getElementById('tipo').value;var diaSemana=document.getElementById('diaSemana').value;var inicio=parseInt(document.getElementById('inicioFolga').value);var diasFolga=document.getElementById('diasFolga').value;if(!nome){alert('Digite nome');return}funcs.push({nome:nome,hor:hor,tipo:tipo,diaSemana:diaSemana,inicio:inicio,diasFolga:diasFolga});lista();gerar();}
function lista(){var d=document.getElementById('lista');if(funcs.length==0){d.innerHTML='Nenhum';return}var t='Adicionados: '+funcs.length+'<br>';for(var i=0;i<funcs.length;i++){t+=(i+1)+'. '+funcs[i].nome+' | '+funcs[i].hor+' <a href="#" onclick="rem('+i+')">[X]</a><br>'}d.innerHTML=t}
function rem(i){funcs.splice(i,1);lista();gerar();}
function limpar(){funcs=[];lista();gerar();}
function exemplo(){funcs=[{nome:'Natal',hor:'15:20-22:40',tipo:'5x1',inicio:0,diaSemana:'Segunda',diasFolga:''},{nome:'Kaue',hor:'07:00-15:20',tipo:'5x1',inicio:1,diaSemana:'Segunda',diasFolga:''},{nome:'Mario',hor:'22:40-07:00',tipo:'5x1',inicio:2,diaSemana:'Segunda',diasFolga:''},{nome:'Jose Marcos',hor:'10:00-18:20',tipo:'5x1',inicio:3,diaSemana:'Segunda',diasFolga:''},{nome:'Alechandre',hor:'22:40-07:00',tipo:'5x1',inicio:4,diaSemana:'Segunda',diasFolga:''},{nome:'Celio Encarregado',hor:'11:00-19:40',tipo:'encarregado',inicio:0,diaSemana:'Segunda',diasFolga:''}];lista();gerar();}
function gerar(){var mes=parseInt(document.getElementById('mes').value);var ano=2026;var dias=new Date(ano,mes,0).getDate();var tab=document.getElementById('tab');if(funcs.length==0){tab.innerHTML='<tr><td>Adicione</td></tr>';return}var dsem=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];var h='<tr><th>Nome</th><th>Horario</th><th>Tipo</th>';for(var d=1;d<=dias;d++){var dt=new Date(ano,mes-1,d);h+='<th>'+d+'/'+mes+'<br>'+dsem[dt.getDay()]+'</th>';}h+='</tr>';for(var i=0;i<funcs.length;i++){var f=funcs[i];h+='<tr><td><b>'+f.nome+'</b></td><td>'+f.hor+'</td><td><small>'+f.tipo+'</small></td>';for(var d=1;d<=dias;d++){var dt=new Date(ano,mes-1,d);var wd=dt.getDay();if(f.tipo=='encarregado'){if(wd==0||wd==6)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}else if(f.tipo=='fixa'){var mapa=['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];if(mapa[wd]==f.diaSemana)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}else if(f.tipo=='personal'){var ld=f.diasFolga.split(',').map(s=>parseInt(s.trim()));if(ld.includes(d))h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}else{if((d+f.inicio)%6==0)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}}h+='</tr>';}tab.innerHTML=h;}
trocaTipo();
</script>
</body>
</html>
