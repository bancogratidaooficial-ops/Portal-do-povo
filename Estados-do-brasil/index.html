<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estados do Brasil - Portal do Povo</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff}
.top{background:linear-gradient(90deg,#009739,#002776);padding:20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;max-width:1000px;margin:auto;padding:12px}
.card{background:#1f1f1f;border:1px solid #2a2a2a;border-left:4px solid #009739;border-radius:14px;padding:16px 8px;text-decoration:none;color:#fff;text-align:center;display:block}
.card b{font-size:14px}
#floatVideo{position:fixed;bottom:12px;right:12px;width:200px;height:360px;background:#000;border:2px solid #009739;border-radius:14px;z-index:9999;overflow:hidden}
#floatVideo iframe{width:100%;height:320px;border:0}
.floatCtrl{background:#111;display:flex;justify-content:space-between;padding:6px 8px}
.btnSom{background:#009739;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:11px}
.btnFechar{background:#e50914;color:#fff;width:26px;height:26px;border-radius:50%;position:absolute;top:-8px;right:-8px;z-index:10001;border:2px solid #fff}
</style>
</head>
<body>

<div class="grid">
