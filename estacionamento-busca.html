<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estacionamento Pisos</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#080808;color:#fff;padding:10px}
.header{background:#ffcc00;color:#000;padding:12px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.pisos{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:10px 0}
.piso{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.piso.ativo{border:2px solid #ffcc00;background:#221e00}
.piso b{display:block;color:#ffcc00;font-size:18px}.piso small{color:#888;font-size:10px}
.boxEntrada{border:1px solid #ffcc00;border-radius:14px;padding:10px;background:#111;margin-bottom:10px}
input,select{width:100%;background:#000;border:1px solid #333;border-radius:8px;padding:12px;color:#fff;margin-top:6px;text-transform:uppercase}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:900;margin-top:8px}
.btn-y{background:#ffcc00;color:#000}.btn-g{background:#00c853;color:#fff}
#video{width:100%;border-radius:10px;display:none;margin-top:8px;border:2px solid #ffcc00}
.list{background:#111;border-radius:14px;padding:8px}
.item{background:#1e1e1e;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-left:4px solid #ffcc00}
.item.p1{border-left-color:#00e5ff}.item.p2{border-left-color:#00e676}.item.p3{border-left-color:#ff9100}.item.p4{border-left-color:#d500f9}
.badge{font-size:9px;background:#333;padding:2px 6px;border-radius:6px;margin-left:5px}
.btnSair{background:#ff2222;color:#fff;border:none;padding:12px 18px;border-radius:20px;font-weight:900}
.recibo{border:2px dashed #ffcc00;border-radius:16px;padding:14px;background:#151300;margin-top:12px;display:none}
.totais{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.tot{background:#151515;border-radius:10px;padding:10px;text-align:center;border:1px solid #222}
</style></head><body>

<div class="header"><span>🅿️ estacionament</span><span style="background:#000;color:#fff;padding:6px 10px;border-radius:20px" onclick="location.href='../index.html'">🏠</span></div>

<div class="totais">
<div class="tot"><small>PÁTIO TOTAL</small><b id="qtdTotal" style="color:#ffcc00">0 carros</b></div>
<div class="tot"><small>FATURADO HOJE</small><b id="fatTotal" style="color:#00e676">R$ 0</b></div>
</div>

<div class="pisos" id="pisos">
<div class="piso ativo" onclick="filtrar(0)"><small>PISO</small><b>TODOS</b><small id="c0">0</small></div>
<div class="piso" onclick="filtrar(1)"><small>PISO 1</small><b id="c1">0</b><small id="f1">R$0</small></div>
<div class="piso" onclick="filtrar(2)"><small>PISO 2</small><b id="c2">0</b><small id="f2">R$0</small></div>
<div class="piso" onclick="filtrar(3)"><small>PISO 3</small><b id="c3">0</b><small id="f3">R$0</small></div>
</div>
<div class="pisos" style="margin-top:0"><div class="piso" style="grid-column:span 4" onclick="filtrar(4)"><small>PISO 4</small><b id="c4">0</b><small id="f4">R$0 - COBERTURA</small></div></div>

<div class="boxEntrada">
<b>📷 ENTRADA COM CÂMERA</b>
<button class="btn btn-y" onclick="abrirCam()">📷 LER PLACA PELA CÂMERA</button>
<video id="video" autoplay playsinline></video><canvas id="canvas" style="display:none"></canvas>
<button id="btnCap" class="btn" style="display:none;background:#fff;color:#000" onclick="capturar()">📸 CAPTURAR PLACA</button>
<p id="status" style="text-align:center;color:#ffcc00;font-size:12px;margin-top:6px"></p>
---
<input id="placa" placeholder="Placa ex: BRA2E19" maxlength="7">
<input id="modelo" placeholder="Modelo/Cor">
<select id="pisoSel"><option value="1">PISO 1 - TÉRREO</option><option value="2">PISO 2</option><option value="3">PISO 3</option><option value="4">PISO 4 - COBERTURA</option></select>
<button class="btn btn-y" onclick="add()">+ REGISTRAR ENTRADA MANUAL</button>
</div>

<div class="list" id="lista"></div>

<div class="recibo" id="recibo"></div>

<script>
let filtro=0;
let carros=JSON.parse(localStorage.getItem('patio_pisos_v5')||'[]');
let hist=JSON.parse(localStorage.getItem('hist_pisos_v5')||'[]');
let stream=null;

function calc(pMin){
 if(pMin<=30) return {v:10,txt:'Meia hora (até 30min)'};
 if(pMin<=60) return {v:18,txt:'1 Hora (até 60min)'};
 if(pMin<=720) return {v:40,txt:'Meia diária (passou de 2h)'};
 return {v:50,txt:'Diária (passou de 12h)'};
}
function salvar(){
 localStorage.setItem('patio_pisos_v5',JSON.stringify(carros));
 localStorage.setItem('hist_pisos_v5',JSON.stringify(hist));
 render();
}
function add(){
 let p=document.getElementById('placa').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
 let m=document.getElementById('modelo').value||'-';
 let piso=parseInt(document.getElementById('pisoSel').value);
 if(p.length<7) return alert('Placa inválida');
 if(carros.some(c=>c.placa===p)) return alert('Já está no pátio!');
 carros.unshift({placa:p,modelo:m,piso:piso,entrada:Date.now()});
 document.getElementById('placa').value=''; document.getElementById('modelo').value='';
 salvar();
}
function filtrar(n){
 filtro=n;
 document.querySelectorAll('.piso').forEach((e,i)=>{e.classList.remove('ativo');});
 if(n==0) document.getElementById('pisos').children[0].classList.add('ativo');
 else document.querySelectorAll('.piso')[n].classList.add('ativo'); // simplificado
 render();
}
function render(){
 let lista=document.getElementById('lista');
 let filtrados=filtro==0?carros:carros.filter(c=>c.piso==filtro);
 let html='';
 filtrados.forEach(c=>{
  let idx=carros.indexOf(c);
  let diff=Math.floor((Date.now()-c.entrada)/60000);
  let data=new Date(c.entrada).toLocaleString('pt-BR');
  html+=`<div class="item p${c.piso}"><div><b>${c.placa} <span class="badge">P${c.piso}</span></b><br><small>${data} • ${diff} min • ${c.modelo}</small></div><button class="btnSair" onclick="sair(${idx})">SAÍDA R$</button></div>`;
 });
 lista.innerHTML=html||'<p style="text-align:center;color:#555;padding:20px">Nenhum carro neste piso</p>';

 // contadores
 [1,2,3,4].forEach(p=>{
  let q=carros.filter(c=>c.piso==p).length;
  document.getElementById('c'+p).innerText=q+(p==0?'':' carros');
 });
 document.getElementById('c0').innerText=carros.length+' carros';
 document.getElementById('qtdTotal').innerText=carros.length+' carros';

 let fatPorPiso=[0,0,0,0,0];
 hist.forEach(h=>{fatPorPiso[h.piso]+=h.valor;});
 [1,2,3,4].forEach(p=>{document.getElementById('f'+p).innerText='R$'+fatPorPiso[p];});
 document.getElementById('fatTotal').innerText='R$ '+hist.reduce((s,h)=>s+h.valor,0);
}
function sair(i){
 let c=carros[i];
 let diff=Math.floor((Date.now()-c.entrada)/60000);
 let cob=calc(diff);
 let saida=Date.now();
 let rec=document.getElementById('recibo');
 rec.style.display='block';
 rec.innerHTML=`
 <b style="color:#ffcc00">🧾 RECIBO</b><br><br>
 Placa: <b>${c.placa}</b><br>
 Modelo: ${c.modelo}<br>
 Piso: ${c.piso}<br>
 Entrada: ${new Date(c.entrada).toLocaleString('pt-BR')}<br>
 Saída: ${new Date(saida).toLocaleString('pt-BR')}<br>
 Tempo: ${diff} min (${(diff/60).toFixed(1)}h)<br>
 Cobrança: ${cob.txt}<br><br>
 <b style="color:#ffcc00;font-size:22px">TOTAL: R$ ${cob.v},00</b><br>
 <small>Banco Gratidão - Estacionamento P${c.piso}</small><br><br>
 <button class="btn btn-y" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
 <button class="btn" style="background:#222;color:#fff" onclick="confirmarSaida(${i},${cob.v},${saida})">Confirmar Saída e Fechar</button>
 <button class="btn" style="background:#000;color:#888" onclick="document.getElementById('recibo').style.display='none'">Fechar</button>
 `;
 rec.scrollIntoView({behavior:'smooth'});
}
function confirmarSaida(i,v,saida){
 let c=carros[i];
 hist.unshift({placa:c.placa,modelo:c.modelo,piso:c.piso,entrada:c.entrada,saida:saida,valor:v});
 carros.splice(i,1);
 document.getElementById('recibo').style.display='none';
 salvar();
}
async function abrirCam(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  let video=document.getElementById('video'); video.srcObject=stream; video.style.display='block';
  document.getElementById('btnCap').style.display='block';
 }catch(e){alert('Permita a câmera no navegador');}
}
async function capturar(){
 let v=document.getElementById('video'); let canvas=document.getElementById('canvas');
 canvas.width=v.videoWidth; canvas.height=v.videoHeight; canvas.getContext('2d').drawImage(v,0,0);
 document.getElementById('status').innerText='🔍 Lendo placa...';
 try{
  const {data:{text}} = await Tesseract.recognize(canvas,'eng',{tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'});
  let limpo=text.toUpperCase().replace(/[^A-Z0-9]/g,'');
  let m=limpo.match(/[A-Z]{3}[0-9][A-Z0-9][0-9]{2}/)||limpo.match(/[A-Z]{3}[0-9]{4}/);
  if(m){document.getElementById('placa').value=m[0]; document.getElementById('status').innerText='✅ LIDO: '+m[0];
  stream.getTracks().forEach(t=>t.stop()); v.style.display='none'; document.getElementById('btnCap').style.display='none';
  }else{document.getElementById('status').innerText='❌ Tente de novo. Lido: '+limpo;}
 }catch(e){document.getElementById('status').innerText='Erro: '+e.message;}
}
setInterval(render,30000);
render();
</script>
</body></html>
