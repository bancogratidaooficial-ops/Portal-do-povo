<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estacionamento - Valores</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff;padding:12px}
header{background:#ffcc00;color:#000;padding:14px;border-radius:12px;display:flex;justify-content:space-between}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin-top:12px}
input{width:100%;padding:12px;margin:5px 0;border-radius:8px;background:#000;color:#fff;border:1px solid #333}
.btn{padding:12px 16px;border-radius:20px;border:none;font-weight:800;cursor:pointer}
.btn-y{background:#ffcc00;color:#000}.btn-g{background:#0f0;color:#000}.btn-r{background:#f33;color:#fff}
video{width:100%;border-radius:12px;border:3px solid #ffcc00;display:none;margin-top:8px}
.item{background:#1a1a1a;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
#placaLida{font-size:32px;font-weight:900;color:#ffcc00;text-align:center;letter-spacing:3px}
</style></head><body>
<header><b>🅿️ estacionament</b><a href="../index.html" style="background:#000;color:#ffcc00;padding:6px 12px;border-radius:20px;text-decoration:none;font-size:11px">🏠</a></header>

<div class="card" style="border-color:#ffcc00">
<h4 style="color:#ffcc00">📷 ENTRADA COM CÂMERA</h4>
<button class="btn btn-y" style="width:100%;margin-top:8px" onclick="abrirCamera()">📷 LER PLACA PELA CÂMERA</button>
<video id="cam" autoplay playsinline></video>
<div id="placaLida">---</div>
<button id="bCap" class="btn btn-y" style="display:none;width:100%" onclick="capturar()">📸 CAPTURAR</button>
<button id="bLan" class="btn btn-g" style="display:none;width:100%;margin-top:6px" onclick="lancarCamera()">✅ ENTRADA</button>
<p id="status" style="font-size:11px;color:#aaa;text-align:center"></p>
</div>

<div class="card">
<input id="placa" placeholder="Placa ex: BRA2E19">
<input id="modelo" placeholder="Modelo/Cor">
<button class="btn btn-y" style="width:100%" onclick="lancarManual()">+ REGISTRAR ENTRADA MANUAL</button>
</div>

<div class="card">
<h3>Pátio: <span id="total" style="color:#ffcc00">0</span> carros</h3>
<div id="lista"></div>
</div>

<div class="card" id="recibo" style="display:none;border:2px dashed #ffcc00">
<h3 style="color:#ffcc00;text-align:center">🧾 RECIBO</h3>
<div id="reciboTxt" style="font-size:14px;line-height:22px;margin-top:10px"></div>
<button class="btn btn-y" style="width:100%;margin-top:10px" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
<button class="btn" style="background:#222;color:#fff;width:100%;margin-top:6px" onclick="document.getElementById('recibo').style.display='none'">Fechar</button>
</div>

<script>
let entradas=JSON.parse(localStorage.getItem('est_entradas_v2')||'[]');
let video=document.getElementById('cam'), placaCam='';

function calcValor(min){
 if(min<=30) return {valor:10, desc:'Meia hora'};
 if(min<=60) return {valor:18, desc:'1 hora'};
 if(min<=720) return {valor:40, desc:'Meia diária (passou de 2h)'};
 return {valor:50, desc:'Diária completa (passou de 12h)'};
}

function abrirCamera(){
 video.style.display='block'; document.getElementById('bCap').style.display='block';
 navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(s=>video.srcObject=s);
}
function limparPlaca(t){
 let txt=t.toUpperCase().replace(/[^A-Z0-9]/g,'');
 let m=txt.match(/[A-Z]{3}[0-9][A-Z0-9][0-9]{2}/)||txt.match(/[A-Z]{3}[0-9]{4}/);
 return m?m[0]:'';
}
async function capturar(){
 let c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight;
 c.getContext('2d').drawImage(video,0,0);
 document.getElementById('status').innerText='Lendo...';
 let {data:{text}}=await Tesseract.recognize(c,'eng',{tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'});
 placaCam=limparPlaca(text);
 if(placaCam){document.getElementById('placaLida').innerText=placaCam; document.getElementById('placa').value=placaCam; document.getElementById('bLan').style.display='block'; document.getElementById('status').innerText='Achou: '+placaCam}
 else document.getElementById('status').innerText='Não achou, chegue mais perto: '+text;
}
function lancarManual(){
 let p=document.getElementById('placa').value.toUpperCase().trim();
 if(!p){alert('Digite placa');return}
 entradas.push({placa:p,modelo:document.getElementById('modelo').value,ts:Date.now(),entrada:new Date().toLocaleString('pt-BR')});
 salvar();
}
function lancarCamera(){
 if(!placaCam){alert('Capture');return}
 entradas.push({placa:placaCam,modelo:document.getElementById('modelo').value,ts:Date.now(),entrada:new Date().toLocaleString('pt-BR')});
 video.srcObject.getTracks().forEach(t=>t.stop()); video.style.display='none';
 document.getElementById('bCap').style.display='none'; document.getElementById('bLan').style.display='none'; document.getElementById('placaLida').innerText='---';
 salvar();
}
function salvar(){localStorage.setItem('est_entradas_v2',JSON.stringify(entradas)); document.getElementById('placa').value=''; document.getElementById('modelo').value=''; render();}
function saida(i){
 let car=entradas[i];
 let min=Math.ceil((Date.now()-car.ts)/60000);
 let calc=calcValor(min);
 let horas=(min/60).toFixed(1);
 if(!confirm(`Placa ${car.placa}\nTempo: ${min} min (${horas}h)\n${calc.desc}\nValor: R$ ${calc.valor},00\nConfirmar saída?`)) return;

 document.getElementById('recibo').style.display='block';
 document.getElementById('reciboTxt').innerHTML=`
 Placa: <b>${car.placa}</b><br>
 Modelo: ${car.modelo||'-'}<br>
 Entrada: ${car.entrada}<br>
 Saída: ${new Date().toLocaleString('pt-BR')}<br>
 Tempo: ${min} min (${horas}h)<br>
 Cobrança: ${calc.desc}<br>
 <h2 style="color:#ffcc00;margin-top:8px">TOTAL: R$ ${calc.valor},00</h2>
 <small>Banco Gratidão - Estacionamento</small>
 `;
 entradas.splice(i,1); salvar();
 let hist=JSON.parse(localStorage.getItem('est_hist_v2')||'[]');
 hist.unshift({...car,saida:new Date().toLocaleString('pt-BR'),min,valor:calc.valor});
 localStorage.setItem('est_hist_v2',JSON.stringify(hist));
}
function render(){
 let h=''; entradas.forEach((c,i)=>{
   let min=Math.ceil((Date.now()-c.ts)/60000);
   h+=`<div class="item"><div><b>${c.placa}</b> <small>${c.modelo||''}</small><br><small>${c.entrada} • ${min} min</small></div><button class="btn btn-r" onclick="saida(${i})">SAÍDA R$</button></div>`;
 });
 document.getElementById('lista').innerHTML=h||'<p style="color:#666;text-align:center">Vazio</p>';
 document.getElementById('total').innerText=entradas.length;
}
render(); setInterval(render,60000);
</script>
</body></html>
