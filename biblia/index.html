<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2263470788888608" crossorigin="anonymous"></script>
<title>BIBLIA</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;text-align:center}
.topo{background:#000;padding:30px;border-bottom:3px solid #ffcc00}
.topo h1{color:#ffcc00;margin:0}
.container{max-width:700px;margin:30px auto;padding:20px}
.card{background:#1a1a1a;border:2px solid #ffcc00;border-radius:20px;padding:25px;margin:20px 0;cursor:pointer}
.card h2{color:#ffcc00}
.btn{background:#ffcc00;color:#000;border:0;padding:12px 30px;border-radius:30px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="topo"><h1>📖 BANCO GRATIDÃO</h1></div>
<div class="container">
<div class="card" onclick="location.href='genesis/'">
<h2>📖 BÍBLIA - GENESIS</h2><p>62 vídeos</p><button class="btn">ABRIR BÍBLIA</button>
</div>
<div class="card" onclick="location.href='curiosidades/'">
<h2>✨ CURIOSIDADES</h2><p>236 vídeos</p><button class="btn">ABRIR CURIOSIDADES</button>
</div>
</div>
<link rel="manifest" href="./manifest.json">
<style>
.fab-mini{position:fixed;bottom:20px;right:15px;z-index:99999;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;width:60px;height:60px;border-radius:50%;border:2px solid #fff;display:none;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.7);cursor:pointer;animation:pulseFab 2s infinite}
@keyframes pulseFab{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
</style>
<button class="fab-mini" id="fabMini" title="Instalar">⬇️</button>
<script>
let dpMini=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();dpMini=e;document.getElementById('fabMini').style.display='flex';});
document.getElementById('fabMini').addEventListener('click', async()=>{ if(!dpMini) return; dpMini.prompt(); const o=await dpMini.userChoice; if(o.outcome==='accepted') document.getElementById('fabMini').style.display='none'; dpMini=null; });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('../sw.js'); }
</script>
</body>
  <!-- BOTÃO FLUTUANTE PARA CHAMAR O PORTAL DO POVO -->
<style>
#btnChamarPortal{
  position:fixed;
  bottom:15px;
  left:10px;
  right:10px;
  z-index:9999;
  background:linear-gradient(90deg,#ff0000,#b30000);
  border:2px solid #FFD700;
  border-radius:16px;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 15px rgba(0,0,0,0.7);
  cursor:pointer;
}
#btnChamarPortal b{color:#fff;font-size:13px}
#btnChamarPortal span{color:#FFD700;font-size:10px;display:block}
#btnChamarPortal .abrir{background:#FFD700;color:#000;padding:8px 18px;border-radius:20px;font-weight:900;font-size:12px}
</style>

<div id="btnChamarPortal" onclick="chamarPortal()">
  <div style="display:flex;align-items:center;gap:10px">
    <img src="IMG-20261026-WA5175.jpg" style="width:50px;height:50px;border-radius:10px;object-fit:cover;border:1px solid #FFD700">
    <div>
      <b>🔴 PORTAL DO POVO AO VIVO</b>
      <span>Toque para chamar o Modão de Curitiba</span>
    </div>
  </div>
  <div class="abrir">CHAMAR</div>
</div>

<script>
function chamarPortal(){
  document.getElementById('playerPovo')?.scrollIntoView({behavior:'smooth'});
  // ativa o som automaticamente
  var p=document.getElementById('playerPovo');
  if(p){ p.src="https://www.youtube.com/embed/DRmuNprF76Y?autoplay=1&mute=0&loop=1&playlist=DRmuNprF76Y&controls=1&rel=0&playsinline=1"; }
  // vibra no Android
  if(navigator.vibrate) navigator.vibrate(200);
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }
</script>
</html>
