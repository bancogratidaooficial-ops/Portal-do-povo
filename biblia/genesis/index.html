<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bíblia Editável - Banco Gratidão</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}
.topo{background:#000;text-align:center;padding:15px;border-bottom:3px solid #ffcc00;position:sticky;top:0;z-index:20}
.topo h1{color:#ffcc00;margin:0;font-size:18px}
.busca{width:90%;padding:12px;border-radius:25px;border:2px solid #ffcc00;background:#1a1a1a;color:#fff;margin:12px auto;display:block;text-align:center}
.card{background:#1a1a1a;border:1px solid #333;border-radius:15px;padding:15px;margin:12px 0}
.video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;background:#000}
.video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.titulo-linha{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.titulo{color:#ffcc00;margin:0;font-size:15px;flex:1;background:transparent;border:1px dashed #444;padding:8px;border-radius:8px;color:#ffcc00}
.lapis{background:#ffcc00;color:#000;border:0;border-radius:50%;width:36px;height:36px;font-size:18px;margin-left:8px;cursor:pointer;font-weight:bold}
.salvo{color:#0f0;font-size:11px;margin-top:5px;display:none}
</style>
<script>
function filtrar(){let t=document.getElementById('busca').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(t)?'block':'none'})}
function editar(id){let input=document.getElementById('t-'+id);input.focus();input.select()}
function salvar(id){let input=document.getElementById('t-'+id);localStorage.setItem('biblia-'+id,input.value);let msg=document.getElementById('s-'+id);msg.style.display='block';setTimeout(()=>msg.style.display='none',2000)}
function carregar(){document.querySelectorAll('.titulo').forEach(inp=>{let id=inp.dataset.id;let salvo=localStorage.getItem('biblia-'+id);if(salvo){inp.value=salvo}})}
window.onload=carregar;
</script>
</head><body>
