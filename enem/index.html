<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gratiFlix ENEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
header{padding:14px 16px;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{color:#ffcc00;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:12px;padding:16px}
.card{width:160px;cursor:pointer}
.card img{width:160px;height:90px;object-fit:cover;object-position:center;border-radius:10px;background:#111;border:1px solid #222;display:block}
.card p{font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:99;flex-direction:column}
#player.active{display:flex;justify-content:center;align-items:center}
.box-video{width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.box-video iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>

<header><b>gratiFlix ENEM</b><span style="font-size:12px;color:#666">24 aulas</span></header>

<div class="row" id="lista"></div>

<div id="player">
  <div class="box-video">
    <iframe id="v2" allowfullscreen></iframe>
  </div>
  <div style="margin-top:20px;text-align:center">
    <h3 id="titulo" style="color:#ffcc00"></h3>
    <button style="margin-top:15px;padding:12px 30px;border-radius:20px;border:0;background:#ffcc00;font-weight:800" onclick="fechar()">X FECHAR</button>
  </div>
</div>

<script>
const aulas = [
{t:"ENEM Aula 01",i:"https://img.youtube.com/vi/LX7abdOcIXA/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/LX7abdOcIXA"},

{t:"ENEM Aula 05",i:"https://img.youtube.com/vi/NMqGgSunrIA/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/NMqGgSunrIA"},
{t:"ENEM Aula 06",i:"https://img.youtube.com/vi/5EyYtHwVsqg/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/5EyYtHwVsqg"},

{t:"ENEM Aula 09",i:"https://img.youtube.com/vi/qmtzGf2t_04/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/qmtzGf2t_04"},

{t:"ENEM Aula 23",i:"https://img.youtube.com/vi/Pei5eIGFgzo/hqdefault.jpg",l:"https://www.youtube-nocookie.com/embed/Pei5eIGFgzo"},

];

const lista=document.getElementById('lista');
lista.innerHTML='';
aulas.forEach((f,i)=>{
  let div=document.createElement('div');
  div.className='card';
  div.innerHTML=`<img src="${f.i}" loading="lazy"><p>${f.t}</p>`;
  div.onclick=()=>abrir(i);
  lista.appendChild(div);
});

function abrir(i){
  let f=aulas[i];
  document.getElementById('titulo').textContent=f.t;
  document.getElementById('player').classList.add('active');
  document.getElementById('v2').src=f.l+'?autoplay=1';
}
function fechar(){
  document.getElementById('player').classList.remove('active');
  document.getElementById('v2').src='';
}
</script>
</body>
</html>
