<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX - ENEM</title>
<style>
  body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}
  .header{padding:15px 15px 5px;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:10;border-bottom:2px solid #ffcc00}
  .logo{font-size:28px;font-weight:900;color:#ffcc00}
  .logo span{color:#fff}
  .categoria{border-left:4px solid #ffcc00;margin:15px;padding-left:12px;font-size:18px;font-weight:bold;color:#ffcc00}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 30px}
  .card{background:#151515;border-radius:12px;overflow:hidden;position:relative;border:1px solid #222}
  .thumb{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ffcc00;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000;box-shadow:0 4px 15px rgba(0,0,0,.6)}
  .titulo{padding:10px;font-size:14px;font-weight:bold}
  .footer-card{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#111}
  .footer-card span{font-size:12px;color:#666}
  .icone{width:32px;height:32px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="header">
  <div class="logo">GRATI<span>FLIX</span></div>
</div>

<div class="categoria">📺 GRATIFLIX ENEM - 24 VÍDEOS</div>

<div class="grid" id="grid"></div>

<script>
const aulas = [
  {id:"LX7abdOcIXA", titulo:"ENEM Aula 01"},
  {id:"x07QsN2eZM4", titulo:"ENEM Aula 02"},
  {id:"yYSiPjDB1JU", titulo:"ENEM Aula 03"},
  {id:"KrB0tn9XfME", titulo:"ENEM Aula 04"},
  {id:"NMqGgSunrIA", titulo:"ENEM Aula 05"},
  {id:"5EyYtHwVsqg", titulo:"ENEM Aula 06"},
  {id:"Q1QVEqSczHI", titulo:"ENEM Aula 07"},
  {id:"tqlKvTE8Rq4", titulo:"ENEM Aula 08"},
  {id:"qmtzGf2t_04", titulo:"ENEM Aula 09"},
  {id:"jR6FYWM6kuQ", titulo:"ENEM Aula 10"},
  {id:"nhkqWaSPJXk", titulo:"ENEM Aula 11"},
  {id:"NbCt6aL2haA", titulo:"ENEM Aula 12"},
  {id:"LSrPcgwkVOE", titulo:"ENEM Aula 13"},
  {id:"tyz9kZ2IWtk", titulo:"ENEM Aula 14"},
  {id:"8BhPBaX4d3w", titulo:"ENEM Aula 15"},
  {id:"K-usgtb41vk", titulo:"ENEM Aula 16"},
  {id:"yv3WWEvqswU", titulo:"ENEM Aula 17"},
  {id:"zQqMQxBoLnc", titulo:"ENEM Aula 18"},
  {id:"EkPkppNArcw", titulo:"ENEM Aula 19"},
  {id:"V7QBNtbZ-zM", titulo:"ENEM Aula 20"},
  {id:"xB4Cy9tjSKk", titulo:"ENEM Aula 21"},
  {id:"MH_bJ1rVX6I", titulo:"ENEM Aula 22"},
  {id:"Pei5eIGFgzo", titulo:"ENEM Aula 23"},
  {id:"SXO9_bIn6zM", titulo:"ENEM Aula 24"},
];

const grid = document.getElementById('grid');
let n = 1;
aulas.forEach(a=>{
  grid.innerHTML += `
    <div class="card" onclick="window.open('https://www.youtube.com/watch?v=${a.id}','_blank')">
      <div class="thumb">
        <img src="https://img.youtube.com/vi/${a.id}/hqdefault.jpg">
        <div class="play">▶</div>
      </div>
      <div class="titulo">Vídeo ${String(n).padStart(3,'0')} - ${a.titulo}</div>
      <div class="footer-card">
        <div class="icone">✏️</div>
        <span>#${String(n).padStart(3,'0')}</span>
        <div class="icone">🗑️</div>
      </div>
    </div>
  `;
  n++;
});
</script>

</body>
</html>
