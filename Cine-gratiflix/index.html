<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFD700">
<link rel="manifest" href="./manifest.json">
<title>CINE GRATIFLIX - 89 Filmes Grátis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#fff;font-family:Arial;padding-bottom:80px}
.top{background:#000;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:2px solid #FFD700}
.hero{padding:14px}.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;background:#111;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer}
.chip.ativo{background:#f00;border-color:#f00;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #222;cursor:pointer;position:relative}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.tag{position:absolute;top:0;left:0;margin:8px;background:#ffcc00;color:#000;font-size:9px;padding:5px 8px;border-radius:12px;font-weight:700}
.card b{display:block;padding:8px;font-size:12px}
#player{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}
#paywall{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:998;display:none;align-items:flex-end}
.paybox{background:#121212;width:100%;border-radius:22px 22px 0 0;padding:20px}
.fab-mini{position:fixed;bottom:20px;right:15px;z-index:99999;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;width:62px;height:62px;border-radius:50%;border:2px solid #fff;display:none;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.8);cursor:pointer;animation:pulseFab 2s infinite}
@keyframes pulseFab{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.destaque{margin:12px 16px;border-radius:16px;overflow:hidden;position:relative;border:2px solid #FFD700}
.destaque img{width:100%;height:190px;object-fit:cover}
.destaque .leg{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:12px}
</style>
</head>
<body>

<div class="top"><div style="font-weight:900">🎬 CINE <b style="color:#f00">GRATIFLIX</b></div><div onclick="location.href='../index.html'" style="cursor:pointer">⬅️ Voltar</div></div>

<div class="destaque" onclick="playFilme(0)">
<img src="https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg" alt="Vingadores">
<div class="leg"><b style="color:#FFD700">🔥 DESTAQUE: VINGADORES - ULTIMATO</b><br><small>Clique e assista grátis - Dublado</small></div>
</div>

<div class="hero">
<div id="chips" class="chips"></div>
<div id="playerTitulo" style="padding:12px;background:#000;display:flex;justify-content:space-between"><b id="playerTitu">Carregando...</b><b onclick="fecharPlayer()" style="cursor:pointer">✕ FECHAR</b></div>
<div id="paywall"><div class="paybox"><div style="display:flex;justify-content:space-between"><b>🎬 VIP?</b><span onclick="document.getElementById('paywall').style.display='none'" style="cursor:pointer">✕</span></div><p style="font-size:13px;color:#aaa;margin:10px 0">Entre no grupo do WhatsApp para liberar todos os filmes sem limite!</p><a id="btnZap" href="#" target="_blank" style="display:block;background:#25D366;color:#fff;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:900">ENTRAR NO GRUPO VIP 📲</a></div></div>
</div>

<div id="grid" class="grid"></div>

<a href="../index.html" style="display:block;text-align:center;margin:20px;color:#FFD700;text-decoration:none;font-weight:900">⬅️ VOLTAR PRO PORTAL</a>

<button class="fab-mini" id="fabMini" title="Instalar Cine">⬇️</button>

<div id="player"><iframe id="iframePlayer" style="flex:1;border:0" allowfullscreen></iframe><div style="padding:12px;background:#111;display:flex;gap:10px"><button onclick="fecharPlayer()" style="flex:1;background:#333;color:#fff;padding:12px;border-radius:10px;border:0">FECHAR</button><button onclick="nextFilme()" style="flex:1;background:#FFD700;color:#000;padding:12px;border-radius:10px;border:0;font-weight:900">PRÓXIMO ⏭️</button></div></div>

<script>
const LINK_GRUPO = "https://chat.whatsapp.com/BtNurXeNf5g2VQZQbTxCs7z";
document.getElementById('btnZap').href = LINK_GRUPO;

let filmesPadraoDoLink = JSON.parse(localStorage.getItem('cine_filmes_pastas') || 'null') || [
{"t":"Vingadores - Ultimato","tag":"LANÇAMENTO","img":"https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg","vid":"TcMBFSGVi1c"},
{"t":"Vingadores - Guerra Infinita","tag":"AÇÃO","img":"https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg","vid":"6ZfuNTqbHE8"},
{"t":"Homem-Aranha - Um Novo Dia","tag":"AÇÃO","img":"https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7OT8oL2oD.jpg","vid":"JfVOs4VSpmA"},
{"t":"Hitman","tag":"LANÇAMENTO","img":"https://img.youtube.com/vi/x5Q5OVQJM2w/hqdefault.jpg","vid":"x5Q5OVQJM2w"},
{"t":"Davi e Golias","tag":"LANÇAMENTO","img":"https://img.youtube.com/vi/bIn2b2gGs/hqdefault.jpg","vid":"bIn2b2gGs"},
{"t":"Filme 01","tag":"LANÇAMENTO","img":"https://img.youtube.com/vi/xZ1qFi2N2Q/hqdefault.jpg","vid":"xZ1qFi2N2Q"},
{"t":"Titanic - O Retorno de Jack","tag":"LANÇAMENTO","img":"https://img.youtube.com/vi/5z4qA4w2IA/hqdefault.jpg","vid":"5z4qA4w2IA"},
{"t":"Superman - Entre Eras","tag":"LANÇAMENTO","img":"https://img.youtube.com/vi/KymrMQEZZI/hqdefault.jpg","vid":"KymrMQEZZI"},
{"t":"Minions - Desejo","tag":"DESENHO","img":"https://img.youtube.com/vi/AJqrp5I1Q/hqdefault.jpg","vid":"AJqrp5I1Q"}
];

let tagAtual = 'TODOS';
let filmeAtual = 0;

function getTags(){
  let tags = ['TODOS',...new Set(filmesPadraoDoLink.map(f=>f.tag))];
  return tags;
}
function renderChips(){
  let c = document.getElementById('chips');
  c.innerHTML = getTags().map(t=>`<div class="chip ${tagAtual===t?'ativo':''}" onclick="filtrar('${t}')">${t}</div>`).join('');
}
function renderGrid(){
  let g = document.getElementById('grid');
  let lista = tagAtual==='TODOS' ? filmesPadraoDoLink : filmesPadraoDoLink.filter(f=>f.tag===tagAtual);
  g.innerHTML = lista.map((f,i)=>{
    let idx = filmesPadraoDoLink.indexOf(f);
    return `<div class="card" onclick="playFilme(${idx})"><div class="tag">${f.tag}</div><img src="${f.img}" loading="lazy" onerror="this.src='https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg'"><b>${f.t}</b></div>`;
  }).join('');
}
function filtrar(t){ tagAtual=t; renderChips(); renderGrid(); }
function playFilme(i){
  filmeAtual=i;
  let f = filmesPadraoDoLink[i];
  document.getElementById('playerTitu').innerText = f.t;
  document.getElementById('iframePlayer').src = `https://www.youtube.com/embed/${f.vid}?autoplay=1`;
  document.getElementById('player').style.display='flex';
}
function fecharPlayer(){ document.getElementById('player').style.display='none'; document.getElementById('iframePlayer').src=''; }
function nextFilme(){ let n = (filmeAtual+1)%filmesPadraoDoLink.length; playFilme(n); }

renderChips(); renderGrid();

// BOTÃO FLUTUANTE DOURADO INSTALAÇÃO
let dpMini=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();dpMini=e;document.getElementById('fabMini').style.display='flex';});
document.getElementById('fabMini').addEventListener('click', async()=>{ if(!dpMini) return; dpMini.prompt(); const o=await dpMini.userChoice; if(o.outcome==='accepted') document.getElementById('fabMini').style.display='none'; dpMini=null; });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('../sw.js'); }
</script>
</body>
</html>
