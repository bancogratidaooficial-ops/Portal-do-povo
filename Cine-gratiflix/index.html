<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#fff;font-family:Arial;padding-bottom:90px}
.top{background:#000;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:2px solid #FFD700}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#0a0a0a}
.btns button{padding:8px 12px;border-radius:20px;border:0;font-size:11px;font-weight:800;cursor:pointer}
.b-amar{background:#FFD700;color:#000}.b-pret{background:#222;color:#fff}.b-verde{background:#25D366;color:#fff}.b-verm{background:#f00;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
.chip{white-space:nowrap;background:#111;border:1px solid #333;padding:7px 13px;border-radius:20px;font-size:11px;cursor:pointer}
.chip.ativo{background:#f00;border-color:#f00}
.destaque{margin:12px 16px;border-radius:16px;overflow:hidden;position:relative;border:2px solid #FFD700;cursor:pointer}
.destaque img{width:100%;height:190px;object-fit:cover}
.destaque .leg{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #222;cursor:pointer;position:relative}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.tag{position:absolute;top:0;left:0;margin:7px;background:#FFD700;color:#000;font-size:9px;padding:4px 8px;border-radius:12px;font-weight:900}
.card b{display:block;padding:8px;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modalBox{background:#121212;width:100%;max-width:400px;border-radius:18px;padding:16px;border:1px solid #333}
.modalBox input,.modalBox select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
#player{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column}
.fab-mini{position:fixed;bottom:20px;right:15px;z-index:99999;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;width:62px;height:62px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.8);cursor:pointer;animation:pulseFab 2s infinite}
@keyframes pulseFab{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>

const GENEROS_FIXOS = ['AÇÃO','COMÉDIA','TERROR','FICÇÃO','DRAMAS','DORAMAS','DESENHOS','ANIMAÇÃO','DOCUMENTÁRIO','BIBLICOS','LEGENDADOS','DUBLADOS','LANÇAMENTO'];
let generosExtras=JSON.parse(localStorage.getItem('cine_generos'))||[];
let tagAtual='TODOS';let filmeAtual=0;
function salvar(){localStorage.setItem('cine_generos',JSON.stringify(generosExtras));}
function getTags(){let base=[...new Set(filmes.map(f=>f.tag))];let todos=[...new Set([...GENEROS_FIXOS,...base,...generosExtras])];return ['TODOS',...todos];}
function renderChips(){document.getElementById('chips').innerHTML=getTags().map(t=>`<div class="chip ${tagAtual===t?'ativo':''}" onclick="filtrar('${t}')">${t}</div>`).join('');let sel=document.getElementById('fGenero');if(sel)sel.innerHTML=getTags().filter(t=>t!=='TODOS').map(t=>`<option>${t}</option>`).join('');}
function renderGrid(){let lista=tagAtual==='TODOS'?filmes:filmes.filter(f=>f.tag===tagAtual);document.getElementById('grid').innerHTML=lista.map(f=>{let idx=filmes.indexOf(f);return `<div class="card" onclick="playFilme(${idx})"><div class="tag">${f.tag}</div><img src="${f.img}" onerror="this.src='https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg'"><b>${f.t}</b></div>`;}).join('');}
function filtrar(t){tagAtual=t;renderChips();renderGrid();}
function playFilme(i){filmeAtual=i;let f=filmes[i];document.getElementById('iframePlayer').src=`https://www.youtube.com/embed/${f.vid}?autoplay=1`;document.getElementById('player').style.display='flex';}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('iframePlayer').src='';}
function nextFilme(){playFilme((filmeAtual+1)%filmes.length);}
function abrirModal(t){document.getElementById(t==='addGenero'?'modalGenero':'modalFilme').style.display='flex';}
function fecharModal(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');}
function addGenero(){let g=document.getElementById('novoGenero').value.trim().toUpperCase();if(!g)return alert('Digite o genero');generosExtras.push(g);salvar();renderChips();fecharModal();document.getElementById('novoGenero').value='';}
function addFilme(){let t=document.getElementById('fTitulo').value.trim();let tag=document.getElementById('fGenero').value;let img=document.getElementById('fImg').value.trim();let vid=document.getElementById('fVid').value.trim();if(!t||!vid)return alert('Titulo e ID obrigatorios');if(vid.includes('v='))vid=vid.split('v=')[1].split('&')[0];if(!img)img=`https://img.youtube.com/vi/${vid}/hqdefault.jpg`;filmes.unshift({t:t,tag:tag,img:img,vid:vid});renderChips();renderGrid();fecharModal();document.getElementById('fTitulo').value='';document.getElementById('fImg').value='';document.getElementById('fVid').value='';}
function compartilhar(){let texto=`CINE GRATIFLIX - 89 FILMES GRATIS! https://bancograti-ooficial-ops.github.io/Portal-do-povo/Cine-gratiflix/ Grupo VIP: ${LINK_GRUPO}`;window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');}
function convidar(){let texto=`Voce foi convidado para o CINE GRATIFLIX! 89 filmes gratis: https://bancograti-ooficial-ops.github.io/Portal-do-povo/Cine-gratiflix/ Grupo VIP: ${LINK_GRUPO}`;window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');}
renderChips();renderGrid();
let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('fabMini').style.display='flex';});
document.getElementById('fabMini').addEventListener('click',async()=>{if(!dp)return;dp.prompt();const o=await dp.userChoice;if(o.outcome==='accepted')document.getElementById('fabMini').style.display='none';dp=null;});
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js');}
</script>
