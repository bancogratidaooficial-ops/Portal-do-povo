<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2263470788888608" crossorigin="anonymous"></script>
<script async custom-element="amp-auto-ads" src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js"></script>
<meta name="theme-color" content="#FFD700">
<link rel="manifest" href="./manifest.json">
<title>CINE GRATIFLIX - 89 Filmes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#fff;font-family:Arial;padding-bottom:90px}
.top{background:#000;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:2px solid #FFD700}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#0a0a0a}
.btns button{padding:8px 12px;border-radius:20px;border:0;font-size:11px;font-weight:800;cursor:pointer}
.b-amar{background:#FFD700;color:#000}.b-pret{background:#222;color:#fff}.b-verde{background:#25D366;color:#fff}.b-verm{background:#f00;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
.chip{white-space:nowrap;background:#111;border:1px solid #333;padding:7px 13px;border-radius:20px;font-size:11px;cursor:pointer}
.chip.ativo{background:#f00;border-color:#f00}
.destaque{margin:12px 16px;border-radius:16px;overflow:hidden;position:relative;border:2px solid #FFD700;cursor:pointer}
.destaque img{width:100%;height:190px;object-fit:cover}
.destaque .leg{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #222;cursor:pointer;position:relative}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.tag{position:absolute;top:0;left:0;margin:7px;background:#FFD700;color:#000;font-size:9px;padding:4px 8px;border-radius:12px;font-weight:900}
.card b{display:block;padding:8px;font-size:11px}
.ad-box{grid-column:1/-1;background:#0a0a0a;border:1px dashed #FFD700;border-radius:12px;padding:8px;text-align:center;margin:4px 0}
.ad-box small{color:#666;font-size:9px;display:block;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modalBox{background:#121212;width:100%;max-width:400px;border-radius:18px;padding:16px;border:1px solid #333}
.modalBox input,.modalBox select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
#player{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column}
.fab-mini{position:fixed;bottom:20px;right:15px;z-index:99999;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;width:62px;height:62px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.8);cursor:pointer;animation:pulseFab 2s infinite}
@keyframes pulseFab{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
<amp-auto-ads type="adsense" data-ad-client="ca-pub-2263470788888608"></amp-auto-ads>

<div class="top"><div style="font-weight:900">🎬 CINE <b style="color:#f00">GRATIFLIX</b></div><div onclick="location.href='../index.html'" style="cursor:pointer">⬅️ Voltar</div></div>

<div class="btns">
<button class="b-amar" onclick="abrirModal('addGenero')">+ GENERO</button>
<button class="b-amar" onclick="abrirModal('addFilme')">+ FILME</button>
<button class="b-verde" onclick="compartilhar()">📤 COMPARTILHAR</button>
<button class="b-verm" onclick="convidar()">👥 CONVIDAR</button>
</div>

<div class="destaque" onclick="playFilme(0)">
<img src="https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg">
<div class="leg"><b style="color:#FFD700">🔥 DESTAQUE: VINGADORES - ULTIMATO</b><br><small>89 Filmes Gratis - Clique pra assistir</small></div>
</div>

<!-- ANUNCIO 1 - DEPOIS DO DESTAQUE -->
<div class="ad-box"><small>PUBLICIDADE</small>
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2263470788888608" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div id="chips" class="chips"></div>
<div id="grid" class="grid"></div>

<!-- ANUNCIO 2 - RODAPE -->
<div class="ad-box" style="margin:12px 16px"><small>PUBLICIDADE</small>
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2263470788888608" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div id="modalGenero" class="modal"><div class="modalBox"><h3 style="color:#FFD700">+ GENERO</h3><input id="novoGenero" placeholder="Ex: COMEDIA, TERROR"><div style="display:flex;gap:8px;margin-top:10px"><button class="b-pret" onclick="fecharModal()" style="flex:1;padding:12px">CANCELAR</button><button class="b-amar" onclick="addGenero()" style="flex:1;padding:12px">SALVAR</button></div></div></div>
<div id="modalFilme" class="modal"><div class="modalBox"><h3 style="color:#FFD700">+ FILME</h3><input id="fTitulo" placeholder="Titulo"><select id="fGenero"></select><input id="fImg" placeholder="Link imagem"><input id="fVid" placeholder="ID YouTube"><div style="display:flex;gap:8px;margin-top:10px"><button class="b-pret" onclick="fecharModal()" style="flex:1;padding:12px">CANCELAR</button><button class="b-amar" onclick="addFilme()" style="flex:1;padding:12px">SALVAR</button></div></div></div>
<button class="fab-mini" id="fabMini">⬇️</button>
<div id="player"><iframe id="iframePlayer" style="flex:1;border:0" allowfullscreen></iframe><div style="padding:12px;background:#111;display:flex;gap:10px"><button onclick="fecharPlayer()" style="flex:1;background:#333;color:#fff;padding:12px;border-radius:10px;border:0">FECHAR</button><button onclick="nextFilme()" style="flex:1;background:#FFD700;color:#000;padding:12px;border-radius:10px;border:0;font-weight:900">PROXIMO</button></div></div>

<script>
const LINK_GRUPO="https://chat.whatsapp.com/BtNurXeNf5g2VQZQbTxCs7z";
let filmes=[{"t":"Vingadores - Ultimato","tag":"ACAO","img":"https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg","vid":"TcMBFSGVi1c"},{"t":"Hitimam","tag":"LANCAMENTO","img":"https://img.youtube.com/vi/x5QSOVQJM2w/hqdefault.jpg","vid":"x5QSOVQJM2w"},{"t":"Davi e Golias","tag":"LANCAMENTO","img":"https://img.youtube.com/vi/8Iw8z2bZg6s/hqdefault.jpg","vid":"8Iw8z2bZg6s"} /* ... SEUS 89 FILMES CONTINUAM AQUI IGUAIS ... */ ];

const GENEROS_FIXOS = ['AÇÃO','COMÉDIA','TERROR','FICÇÃO','DRAMAS','DORAMAS','DESENHOS','ANIMAÇÃO','DOCUMENTÁRIO','BIBLICOS','LEGENDADOS','DUBLADOS','LANÇAMENTO','ANIME','DRAMA'];
let generosExtras=JSON.parse(localStorage.getItem('cine_generos'))||[];
let tagAtual='TODOS';let filmeAtual=0;
function normalizar(t){return t.toUpperCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function salvar(){let unicos=[];let vistos=new Set();generosExtras.forEach(g=>{let n=normalizar(g);if(!vistos.has(n)){vistos.add(n);unicos.push(g.toUpperCase());}});generosExtras=unicos;localStorage.setItem('cine_generos',JSON.stringify(generosExtras));}
function getTags(){let todasTags=[...filmes.map(f=>f.tag),...GENEROS_FIXOS,...generosExtras];let mapa=new Map();todasTags.forEach(tag=>{if(!tag)return;let chave=normalizar(tag);if(!mapa.has(chave)){mapa.set(chave,tag.toUpperCase());}});let listaFinal=Array.from(mapa.values());listaFinal.sort();return ['TODOS',...listaFinal];}
function filtrar(tag){tagAtual=tag;renderChips();renderGrid();}
function renderChips(){document.getElementById('chips').innerHTML=getTags().map(t=>`<div class="chip ${tagAtual===t?'ativo':''}" onclick="filtrar('${t}')">${t}</div>`).join('');let sel=document.getElementById('fGenero');if(sel)sel.innerHTML=getTags().filter(t=>t!=='TODOS').map(t=>`<option>${t}</option>`).join('');}

function renderGrid(){
let lista=tagAtual==='TODOS'?filmes:filmes.filter(f=>normalizar(f.tag)===normalizar(tagAtual));
let html='';
lista.forEach((f, idxReal) => {
  let idx=filmes.indexOf(f);
  // ANUNCIO A CADA 8 FILMES
  if(idxReal>0 && idxReal%8===0){
    html+=`<div class="ad-box"><small>PUBLICIDADE</small><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2263470788888608" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script></div>`;
  }
  html+=`<div class="card" onclick="playFilme(${idx})"><div class="tag">${f.tag}</div><img src="${f.img}" onerror="this.src='https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg'"><b>${f.t}</b></div>`;
});
document.getElementById('grid').innerHTML=html;
// Recarrega anuncios
try{(adsbygoogle = window.adsbygoogle || []).push({});}catch(e){}
}

function playFilme(i){filmeAtual=i;let f=filmes[i];document.getElementById('iframePlayer').src=`https://www.youtube.com/embed/${f.vid}?autoplay=1`;document.getElementById('player').style.display='flex';}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('iframePlayer').src='';}
function nextFilme(){playFilme((filmeAtual+1)%filmes.length);}
function abrirModal(t){document.getElementById(t==='addGenero'?'modalGenero':'modalFilme').style.display='flex';}
function fecharModal(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');}
function addGenero(){let g=document.getElementById('novoGenero').value.trim().toUpperCase();if(!g)return alert('Digite o genero');generosExtras.push(g);salvar();renderChips();fecharModal();document.getElementById('novoGenero').value='';}
function addFilme(){let t=document.getElementById('fTitulo').value.trim();let tag=document.getElementById('fGenero').value;let img=document.getElementById('fImg').value.trim();let vid=document.getElementById('fVid').value.trim();if(!t||!vid)return alert('Titulo e ID obrigatorios');if(vid.includes('v='))vid=vid.split('v=')[1].split('&')[0];if(!img)img=`https://img.youtube.com/vi/${vid}/hqdefault.jpg`;filmes.unshift({t:t,tag:tag,img:img,vid:vid});renderChips();renderGrid();fecharModal();}
function compartilhar(){let texto=`CINE GRATIFLIX - 89 FILMES GRATIS! https://bancograti-ooficial-ops.github.io/Portal-do-povo/Cine-gratiflix/ Grupo VIP: ${LINK_GRUPO}`;window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');}
function convidar(){let texto=`Voce foi convidado para o CINE GRATIFLIX! https://bancograti-ooficial-ops.github.io/Portal-do-povo/Cine-gratiflix/`;window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');}
renderChips();renderGrid();
</script>
</body>
</html>
