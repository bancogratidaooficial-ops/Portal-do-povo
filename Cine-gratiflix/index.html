<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFD700">
<link rel="manifest" href="./manifest.json">
<title>CINE GRATIFLIX - 89 Filmes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#fff;font-family:Arial;padding-bottom:90px}
.top{background:#000;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:2px solid #FFD700}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#0a0a0a;border-bottom:1px solid #222}
.btns button{padding:8px 12px;border-radius:20px;border:0;font-size:11px;font-weight:800;cursor:pointer}
.b-amar{background:#FFD700;color:#000}.b-pret{background:#222;color:#fff;border:1px solid #444}.b-verde{background:#25D366;color:#fff}.b-verm{background:#f00;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
.chip{white-space:nowrap;background:#111;border:1px solid #333;padding:7px 13px;border-radius:20px;font-size:11px;cursor:pointer}
.chip.ativo{background:#f00;border-color:#f00}
.destaque{margin:12px 16px;border-radius:16px;overflow:hidden;position:relative;border:2px solid #FFD700;cursor:pointer}
.destaque img{width:100%;height:190px;object-fit:cover}
.destaque .leg{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #222;cursor:pointer;position:relative}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.tag{position:absolute;top:0;left:0;margin:7px;background:#FFD700;color:#000;font-size:9px;padding:4px 8px;border-radius:12px;font-weight:900}
.card b{display:block;padding:8px;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modalBox{background:#121212;width:100%;max-width:400px;border-radius:18px;padding:16px;border:1px solid #333}
.modalBox input,.modalBox select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
#player{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column}
.fab-mini{position:fixed;bottom:20px;right:15px;z-index:99999;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;width:62px;height:62px;border-radius:50%;border:2px solid #fff;display:none;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.8);cursor:pointer;animation:pulseFab 2s infinite}
@keyframes pulseFab{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>

<div class="top"><div style="font-weight:900">🎬 CINE <b style="color:#f00">GRATIFLIX</b></div><div style="display:flex;gap:10px"><span onclick="location.href='../index.html'" style="cursor:pointer">⬅️ Voltar</span><span onclick="document.getElementById('player').style.display='none';document.getElementById('iframePlayer').src=''" style="cursor:pointer">✕</span></div></div>

<div class="btns">
<button class="b-amar" onclick="abrirModal('addGenero')">+ GÊNERO</button>
<button class="b-amar" onclick="abrirModal('addFilme')">+ FILME</button>
<button class="b-verde" onclick="compartilhar()">📤 COMPARTILHAR</button>
<button class="b-verm" onclick="convidar()">👥 CONVIDAR MEMBROS</button>
<button class="b-pret" onclick="backup()">💾 BACKUP</button>
</div>

<div class="destaque" onclick="playFilme(0)">
<img src="https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg">
<div class="leg"><b style="color:#FFD700">🔥 DESTAQUE: VINGADORES - ULTIMATO - 89 FILMES GRÁTIS</b><br><small>Clique e assista agora - Dublado</small></div>
</div>

<div id="chips" class="chips"></div>
<div id="grid" class="grid"></div>

<!-- MODAL ADD GENERO -->
<div id="modalGenero" class="modal"><div class="modalBox">
<h3 style="color:#FFD700">+ ADICIONAR GÊNERO</h3>
<input id="novoGenero" placeholder="Ex: COMÉDIA, TERROR, ROMANCE...">
<div style="display:flex;gap:8px;margin-top:10px"><button class="b-pret" onclick="fecharModal()" style="flex:1;padding:12px">CANCELAR</button><button class="b-amar" onclick="addGenero()" style="flex:1;padding:12px">SALVAR GÊNERO</button></div>
</div></div>

<!-- MODAL ADD FILME -->
<div id="modalFilme" class="modal"><div class="modalBox">
<h3 style="color:#FFD700">+ ADICIONAR FILME</h3>
<input id="fTitulo" placeholder="Título do filme">
<select id="fGenero"></select>
<input id="fImg" placeholder="Link da imagem (YouTube hqdefault ou TMDB)">
<input id="fVid" placeholder="ID do vídeo YouTube (ex: TcMBFSGVi1c)">
<small style="color:#aaa">Dica: copia link do YouTube e pega só o final depois do v=</small>
<div style="display:flex;gap:8px;margin-top:10px"><button class="b-pret" onclick="fecharModal()" style="flex:1;padding:12px">CANCELAR</button><button class="b-amar" onclick="addFilme()" style="flex:1;padding:12px">SALVAR FILME</button></div>
</div></div>

<a href="../index.html" style="display:block;text-align:center;margin:20px;color:#FFD700;text-decoration:none;font-weight:900">⬅️ VOLTAR PRO PORTAL</a>
<button class="fab-mini" id="fabMini">⬇️</button>
<div id="player"><iframe id="iframePlayer" style="flex:1;border:0" allowfullscreen></iframe><div style="padding:12px;background:#111;display:flex;gap:10px"><button onclick="fecharPlayer()" style="flex:1;background:#333;color:#fff;padding:12px;border-radius:10px;border:0">FECHAR</button><button onclick="compartilharFilme()" style="flex:1;background:#25D366;color:#fff;padding:12px;border-radius:10px;border:0">📤 COMPARTILHAR FILME</button><button onclick="nextFilme()" style="flex:1;background:#FFD700;color:#000;padding:12px;border-radius:10px;border:0;font-weight:900">PRÓXIMO</button></div></div>

<script>
const LINK_GRUPO="https://chat.whatsapp.com/BtNurXeNf5g2VQZQbTxCs7z";
let filmes=JSON.parse(localStorage.getItem('cine_filmes_pastas')||'null')||[
{"t":"Vingadores - Ultimato","tag":"LANÇAMENTO","img":"https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg","vid":"TcMBFSGVi1c"},
{"t":"Vingadores - Guerra Infinita","tag":"AÇÃO","img":"https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg","vid":"6ZfuNTqbHE8"},
{"t":"Homem-Aranha - Sem Volta","tag":"AÇÃO","img":"https://img.youtube.com/vi/JfVOs4VSpmA/hqdefault.jpg","vid":"JfVOs4VSpmA"},
{"t":"Hitman","tag":"LANÇAMENTO","img":"https://img.youtube.com/vi/x5Q5OVQJM2w/hqdefault.jpg","vid":"x5Q5OVQJM2w"},
{"t":"Davi e Golias","tag":"DESENHO","img":"https://img.youtube.com/vi/bIn2b2gGs/hqdefault.jpg","vid":"bIn2b2gGs"}
];
let generosExtras=JSON.parse(localStorage.getItem('cine_generos')||'[]');
let tagAtual='TODOS'; let filmeAtual=0;

function salvar(){localStorage.setItem('cine_filmes_pastas',JSON.stringify(filmes));localStorage.setItem('cine_generos',JSON.stringify(generosExtras));}
function getTags(){let base=[...new Set(filmes.map(f=>f.tag)),...generosExtras];return['TODOS',...base];}
function renderChips(){
document.getElementById('chips').innerHTML=getTags().map(t=>`<div class="chip ${tagAtual===t?'ativo':''}" onclick="filtrar('${t}')">${t}</div>`).join('');
let sel=document.getElementById('fGenero');sel.innerHTML=getTags().filter(t=>t!=='TODOS').map(t=>`<option>${t}</option>`).join('');
}
function renderGrid(){
let lista=tagAtual==='TODOS'?filmes:filmes.filter(f=>f.tag===tagAtual);
document.getElementById('grid').innerHTML=lista.map(f=>{
let idx=filmes.indexOf(f);
return `<div class="card" onclick="playFilme(${idx})"><div class="tag">${f.tag}</div><img src="${f.img}" onerror="this.src='https://image.tmdb.org/t/p/w500/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg'"><b>${f.t}</b><div style="display:flex;gap:4px;padding:4px"><button onclick="event.stopPropagation();remover(${idx})" style="font-size:9px;background:#300;color:#fff;border:0;padding:4px 6px;border-radius:6px">🗑️</button></div></div>`;
}).join('');
}
function filtrar(t){tagAtual=t;renderChips();renderGrid();}
function playFilme(i){filmeAtual=i;let f=filmes[i];document.getElementById('iframePlayer').src=`https://www.youtube.com/embed/${f.vid}?autoplay=1`;document.getElementById('player').style.display='flex';}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('iframePlayer').src='';}
function nextFilme(){playFilme((filmeAtual+1)%filmes.length);}

function abrirModal(t){document.getElementById(t==='addGenero'?'modalGenero':'modalFilme').style.display='flex';}
function fecharModal(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');}

function addGenero(){
let g=document.getElementById('novoGenero').value.trim().toUpperCase();if(!g)return alert('Digite o gênero');
if(getTags().includes(g))return alert('Gênero já existe');
generosExtras.push(g);salvar();renderChips();fecharModal();document.getElementById('novoGenero').value='';alert('Gênero '+g+' adicionado!');
}
function addFilme(){
let t=document.getElementById('fTitulo').value.trim();let tag=document.getElementById('fGenero').value;let img=document.getElementById('fImg').value.trim();let vid=document.getElementById('fVid').value.trim();
if(!t||!vid)return alert('Título e ID do vídeo são obrigatórios');
if(vid.includes('v='))vid=vid.split('v=')[1].split('&')[0]; // extrai id se colar link completo
if(!img)img=`https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
filmes.unshift({t:t,tag:tag,img:img,vid:vid});salvar();renderChips();renderGrid();fecharModal();
document.getElementById('fTitulo').value='';document.getElementById('fImg').value='';document.getElementById('fVid').value='';
alert('Filme adicionado!');
}
function remover(i){if(confirm('Remover filme?')){filmes.splice(i,1);salvar();renderGrid();renderChips();}}

function compartilhar(){
let texto=`🎬 CINE GRATIFLIX - 89 FILMES GRÁTIS!\n\nAssista agora no Portal do Povo:\nhttps://bancogratiãooficial-ops.github.io/Portal-do-povo/Cine-gratiflix/\n\n👥 Entre no grupo VIP: ${LINK_GRUPO}`;
if(navigator.share){navigator.share({title:'Cine Gratiflix',text:texto});}else{window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');}
}
function compartilharFilme(){
let f=filmes[filmeAtual];let texto=`🎬 Tô assistindo ${f.t} no CINE GRATIFLIX grátis!\nhttps://bancogratiãooficial-ops.github.io/Portal-do-povo/Cine-gratiflix/`;
window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');
}
function convidar(){
let texto=`👋 Você foi convidado para o CINE GRATIFLIX!\n\n🎬 89 filmes grátis, sem pagar nada!\n\n👉 Acesse: https://bancogratiãooficial-ops.github.io/Portal-do-povo/Cine-gratiflix/\n\n👥 Grupo VIP: ${LINK_GRUPO}`;
window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');
}
function backup(){
let blob=new Blob([JSON.stringify(filmes)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cine_gratiflix_backup.json';a.click();
}

renderChips();renderGrid();
let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('fabMini').style.display='flex';});
document.getElementById('fabMini').addEventListener('click',async()=>{if(!dp)return;dp.prompt();const o=await dp.userChoice;if(o.outcome==='accepted')document.getElementById('fabMini').style.display='none';dp=null;});
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js');}
</script>
</body>
</html>
