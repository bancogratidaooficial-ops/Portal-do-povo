<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GratiFlix</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}
header{padding:14px;display:flex;gap:10px;background:#000;border-bottom:1px solid #222;position:sticky;top:0;z-index:5}
.row-title{padding:16px;font-weight:800;font-size:18px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 10px}
.card{min-width:130px;cursor:pointer} .card img{width:130px;height:190px;object-fit:cover;border-radius:8px;background:#222}
.card p{font-size:12px;margin-top:5px;color:#ccc}
#player{position:fixed;inset:0;background:#000;display:none;z-index:99;flex-direction:column}
#player.active{display:flex}
video{width:100%;height:60vh;background:#000}
</style></head><body>
<header><b style="color:#ffcc00;font-size:22px">gratiFlix</b><span>tv</span></header>

<div class="row-title">Em Alta - Funcionando 100%</div>
<div class="row">
<div class="card" onclick="play('Batman e Robin 1949 - COMPLETO','https://archive.org/download/BatmanAndRobin1949/BatmanAndRobin1949_512kb.mp4','Agora vemos que pagamos por isso com a nossa liberdade.')"><img src="https://m.media-amazon.com/images/M/MV5BYjU3ZTI1ZTMtYjI1YS00MTIzLTk5ZTItY2QyNGU0MWQ5NmQzXkEyXkFqcGdeQXVyNTAyODkwOQ@@._V1_.jpg"><p>Batman e Robin 1949</p></div>
<div class="card" onclick="play('Captain Marvel 1941','https://archive.org/download/ADVENTURESOFCAPTAINMARVEL/Adventure-Of-Captain-Marvel-1941-E01-Curse-Of-The-Scorpion.mp4','A maldição do escorpião começa!')"><img src="https://m.media-amazon.com/images/M/MV5BMTY1MzM1Njg1MF5BMl5BanBnXkFtZTcwMDQwMDYyMQ@@._V1_.jpg"><p>Captain Marvel</p></div>
<div class="card" onclick="play('Big Buck Bunny - Desenho Livre','https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4','Desenho gratuito para teste do player')"><img src="https://peach.blender.org/wp-content/uploads/title_anouncement.jpg"><p>Big Buck Bunny</p></div>
</div>

<div id="player">
<video id="video" controls autoplay playsinline></video>
<div style="padding:15px;background:#111;flex:1">
<h3 id="titulo" style="color:#ffcc00"></h3>
<p id="legenda" style="margin-top:10px;background:#000;padding:10px;border-radius:6px;text-align:center"></p>
<button onclick="closePlayer()" style="margin-top:15px;background:#ffcc00;border:none;padding:10px 20px;border-radius:20px;font-weight:800">X Fechar</button>
<a href="../index.html" style="margin-left:10px;background:#222;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none">🏠 Portal</a>
</div>
</div>

<script>
function play(t,url,leg){
document.getElementById('titulo').innerText=t;
document.getElementById('legenda').innerText=leg;
let v=document.getElementById('video');
v.src=url; v.load(); v.play();
document.getElementById('player').classList.add('active');
}
function closePlayer(){document.getElementById('player').classList.remove('active');document.getElementById('video').pause();}
</script>
</body></html>
