<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}
header{padding:12px;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.row{display:flex;gap:10px;overflow-x:auto;padding:10px 16px}
.card{min-width:125px;cursor:pointer}.card img{width:125px;height:185px;object-fit:cover;border-radius:8px;background:#222}
.card p{font-size:11px;margin-top:4px}
#player{position:fixed;inset:0;background:#000;display:none;z-index:99;flex-direction:column}
#player.active{display:flex}
.box-video{width:100%;height:60vh;background:#000;position:relative}
.box-video video,.box-video iframe{width:100%;height:100%;border:none}
.form{position:fixed;inset:0;background:#000;display:none;z-index:100;padding:20px;overflow:auto}
.form.active{display:block}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff}
.btn{padding:10px 18px;border-radius:20px;border:none;font-weight:800}
</style></head><body>
<header><b style="color:#ffcc00;font-size:22px">gratiFlix tv</b><button class="btn" style="background:#ffcc00" onclick="document.getElementById('form').classList.add('active')">+ ADICIONAR</button></header>

<div class="row" id="lista"></div>

</div>
</div>

function getYoutubeId(url){
let m=url.match(/(?:youtube\.com.*v=|youtu\.be\/|youtube\.com\/embed\/)([^&\?\/]+)/); return m?m[1]:null;
}
function render(){
let h='';filmes.forEach((f,i)=>{h+=`<div class="card" onclick="play(${i})"><img src="${f.c}" onerror="this.src='https://via.placeholder.com/125x185/222/ffcc00?text=Sem+Capa'"><p>${f.t}</p></div>`});
document.getElementById('lista').innerHTML=h;
}
function play(i){
let f=filmes[i]; document.getElementById('titulo').innerText=f.t; document.getElementById('legenda').innerText=f.leg||'';
let v1=document.getElementById('v1'), v2=document.getElementById('v2');
let yt=getYoutubeId(f.l);
if(yt){v1.style.display='none'; v1.pause(); v2.style.display='block'; v2.src='https://www.youtube.com/embed/'+yt+'?autoplay=1';}
else{v2.style.display='none'; v2.src=''; v1.style.display='block'; v1.src=f.l; v1.load(); v1.play();}
document.getElementById('player').classList.add('active');
}
function fechar(){document.getElementById('player').classList.remove('active'); document.getElementById('v1').pause(); document.getElementById('v2').src='';}
function salvar(){
let t=document.getElementById('f_titulo').value, l=document.getElementById('f_link').value, c=document.getElementById('f_capa').value, leg=document.getElementById('f_leg').value;
if(!t||!l){alert('Falta título e link');return}
filmes.push({t,l,c:c||'https://via.placeholder.com/125x185/222/ffcc00?text=Sem+Capa',leg});
localStorage.setItem('gratiflix_v4',JSON.stringify(filmes)); render(); document.getElementById('form').classList.remove('active');
}
render();
