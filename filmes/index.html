<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
header{padding:12px;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.row{display:flex;gap:12px;overflow-x:auto;padding:16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{min-width:145px;cursor:pointer;flex-shrink:0}
.card img{width:145px;height:210px;object-fit:cover;object-position:top center;border-radius:10px;background:#1a1a1a;display:block;border:1px solid #222}
.card p{font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:145px}
#player{position:fixed;inset:0;background:#000;display:none;z-index:99;flex-direction:column}
#player.active{display:flex}
.box-video{width:100%;height:60vh;background:#000;position:relative;flex-shrink:0}
.box-video video,.box-video iframe{width:100%;height:100%;border:none}
.form{position:fixed;inset:0;background:#000;display:none;z-index:100;padding:20px;overflow:auto}
.form.active{display:block}
input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #333;background:#111;color:#fff;border-radius:8px}
.btn{padding:10px 18px;border-radius:20px;border:0;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<header>
  <b style="color:#ffcc00;font-size:22px">gratiFlix tv</b>
  <button class="btn" style="background:#ffcc00" onclick="document.getElementById('form').classList.add('active')">+ ADICIONAR</button>
</header>

<div class="row" id="lista"></div>

<div id="player">
  <div class="box-video">
    <video id="v1" controls playsinline style="display:none"></video>
    <iframe id="v2" style="display:none" allowfullscreen></iframe>
  </div>
  <div style="padding:15px;background:#111">
    <h3 id="titulo" style="color:#ffcc00"></h3>
    <p id="legenda" style="margin-top:8px;text-align:center;background:#000;padding:8px;border-radius:6px"></p>
    <button class="btn" style="background:#ffcc00;margin-top:12px;width:100%" onclick="fechar()">X Fechar</button>
  </div>
</div>

<div id="form" class="form">
  <h2 style="color:#ffcc00">Adicionar Filme</h2>
  <p style="font-size:11px;color:#aaa;margin:6px 0">Pode colar link do YouTube agora! Ex: https://youtu.be/...</p>
  <input id="f_titulo" placeholder="Nome do filme">
  <input id="f_link" placeholder="Link do vídeo YouTube ou MP4">
  <input id="f_capa" placeholder="Link da capa (opcional) - se deixar vazio eu crio automática com a cara do filme">
  <input id="f_leg" placeholder="Legenda">
  <button class="btn" style="background:#ffcc00;width:100%;margin-top:10px" onclick="salvar()">Salvar</button>
  <button class="btn" style="background:#222;color:#fff;width:100%;margin-top:8px" onclick="document.getElementById('form').classList.remove('active')">Cancelar</button>
</div>

<script>
let filmes = JSON.parse(localStorage.getItem('gratiflix_v4')) || [
{"t":"filmes 1","c":"https://img.youtube.com/vi/qKQyKxNwU1I/hqdefault.jpg","l":"https://www.youtube-nocookie.com/embed/qKQyKxNwU1I","leg":""},
{"t":"filmes 2","c":"https://img.youtube.com/vi/MUZAFGzqUQI/hqdefault.jpg","l":"https://www.youtube-nocookie.com/embed/MUZAFGzqUQI","leg":""},
{"t":"filmes 3","c":"https://img.youtube.com/vi/bSKIRqBShNl/hqdefault.jpg","l":"https://www.youtube-nocookie.com/embed/bSKIRqBShNl","leg":""}
];

// FUNÇÃO QUE EXTRAI ID E CRIA CAPA BONITA
function getId(url){
  let m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m? m[1] : null;
}
function capaBonita(url, capaSalva){
  if(capaSalva && capaSalva.includes('http')) return capaSalva;
  let id = getId(url);
  if(id) return `https://img.youtube.com/vi/${id}/mqdefault.jpg`; // mqdefault mostra a cara melhor que hqdefault
  return url;
}

const lista = document.getElementById('lista');
function render(){
  lista.innerHTML = '';
  filmes.forEach((f,i)=>{
    let imgSrc = capaBonita(f.l, f.c);
    let div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<img src="${imgSrc}" onerror="this.src='https://img.youtube.com/vi/${getId(f.l)}/hqdefault.jpg'" loading="lazy"><p>${f.t}</p>`;
    div.onclick = ()=> abrir(i);
    lista.appendChild(div);
  });
}
function abrir(i){
  let f = filmes[i];
  document.getElementById('titulo').textContent = f.t;
  document.getElementById('legenda').textContent = f.leg || '';
  document.getElementById('player').classList.add('active');
  let id = getId(f.l);
  if(f.l.includes('.mp4')){
    document.getElementById('v1').src = f.l; document.getElementById('v1').style.display='block'; document.getElementById('v2').style.display='none'; document.getElementById('v1').play();
  } else {
    document.getElementById('v2').src = f.l.includes('embed')? f.l : `https://www.youtube.com/embed/${id}`; document.getElementById('v2').style.display='block'; document.getElementById('v1').style.display='none';
  }
}
function fechar(){
  document.getElementById('player').classList.remove('active');
  document.getElementById('v1').pause(); document.getElementById('v1').src=''; document.getElementById('v2').src='';
}
function salvar(){
  let t = document.getElementById('f_titulo').value || 'Novo Filme';
  let l = document.getElementById('f_link').value.trim();
  let c = document.getElementById('f_capa').value.trim();
  let leg = document.getElementById('f_leg').value;
  if(!l) return alert('Cola o link do filme');
  // se colou youtu.be já converte pra embed
  let id = getId(l);
  if(id &&!l.includes('embed')) l = `https://www.youtube-nocookie.com/embed/${id}`;
  let finalCapa = capaBonita(l, c);
  filmes.unshift({t:t,c:finalCapa,l:l,leg:leg});
  localStorage.setItem('gratiflix_v4', JSON.stringify(filmes));
  document.getElementById('form').classList.remove('active');
  render();
}
render();
</script>
</body>
</html>
