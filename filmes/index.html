<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gratiFlix tv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
header{padding:14px 16px;background:#000;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{color:#ffcc00;font-size:24px}
.row{display:flex;gap:12px;overflow-x:auto;padding:16px;scroll-behavior:smooth}
.row::-webkit-scrollbar{display:none}
.card{min-width:150px;cursor:pointer;transition:.3s}
.card:hover{transform:scale(1.05)}
.card img{width:150px;height:225px;object-fit:cover;object-position:center top;border-radius:12px;background:#111;border:1px solid #222;display:block}
.card p{font-size:13px;margin-top:8px;width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
#player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:99;flex-direction:column;justify-content:center}
#player.active{display:flex}
.box-video{width:100%;max-width:900px;margin:0 auto;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.box-video iframe,.box-video video{width:100%;height:100%;border:0}
.form{position:fixed;inset:0;background:#000;display:none;z-index:100;padding:20px;overflow:auto}
.form.active{display:block}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #333;background:#111;color:#fff;border-radius:8px}
.btn{padding:12px 18px;border-radius:20px;border:0;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<header>
<b>gratiFlix tv</b>
<button class="btn" style="background:#ffcc00" onclick="document.getElementById('form').classList.add('active')">+ ADICIONAR</button>
</header>

<div class="row" id="lista"></div>

<div id="player">
  <div class="box-video">
    <video id="v1" controls playsinline style="display:none"></video>
    <iframe id="v2" style="display:none" allowfullscreen allow="autoplay"></
