<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFD700">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../icon.png">
<title>MENSAGENS DIÁRIAS - Portal do Povo</title>
<style>
*{box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px;margin:0;padding-bottom:90px}
h2{color:#FFD700;text-align:center;margin:10px 0}
.ia-box{background:#151515;border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0;text-align:center}
.azul{background:#0055ff;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:900;width:100%;cursor:pointer;margin-top:6px}
.preto{background:#1a1a1a;color:#fff;border:1px solid #333;padding:10px;border-radius:10px;flex:1;cursor:pointer}
.amarelo{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;border:none;padding:12px;border-radius:10px;font-weight:900;width:100%;cursor:pointer;margin-top:6px}
select,textarea,input[type="time"]{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin-top:6px}
textarea{min-height:70px}
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.filtros button{font-size:11px}
.ativo{background:#FFD700!important;color:#000!important}
.card-msg{background:#111;border:1px solid #222;border-radius:12px;padding:10px;margin:8px 0}
.card-msg small{color:#888}
.alarme-box{background:#111;border:1px solid #333;border-radius:12px;padding:10px;margin:10px 0}
.topo-voltar{display:block;text-align:center;margin:12px;color:#FFD700;text-decoration:none;font-weight:900}
/* BOTÃO FLUTUANTE DOURADO MENSAGENS */
.fab-mini{position:fixed;bottom:20px;right:15px;z-index:99999;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;width:62px;height:62px;border-radius:50%;border:2px solid #fff;display:none;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.8);cursor:pointer;animation:pulseFab 2s infinite}
@keyframes pulseFab{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>

<h2>💬 MENSAGENS DIÁRIAS - IA ATUALIZA</h2>

<div class="ia-box">
<span style="color:#FFD700">🤖 IA ATIVA</span><br>
<small id="infoIA" style="color:#aaa">Gerando mensagens novas todo dia. Toque abaixo:</small><br>
<button class="azul" onclick="gerarIA()">✨ GERAR 5 MENSAGENS NOVAS COM IA</button>
</div>

<select id="periodo">
<option value="manha">🌅 Manhã</option>
<option value="tarde">🌇 Tarde</option>
<option value="noite">🌙 Noite</option>
<option value="gratidao">🙏 Gratidão</option>
<option value="motivacao">💪 Motivação</option>
<option value="esperanca">🙏 Esperança</option>
</select>

<textarea id="nova" placeholder="Escreva sua mensagem..."></textarea>

<div style="display:flex;gap:5px">
<button class="preto" onclick="document.getElementById('audioFile').click()">🎙️ Add Áudio Celular</button>
<button class="preto" onclick="document.getElementById('textFile').click()">📄 Add Texto Celular</button>
</div>

<input type="file" id="audioFile" accept="audio/*" style="display:none">
<input type="file" id="txtFile" accept=".txt,.json" style="display:none">
<button class="amarelo" onclick="addMsg()">+ SALVAR MENSAGEM</button>

<div class="alarme-box">
<strong style="color:#FFD700">⏰ ALARME COM ÁUDIO ADICIONADO</strong>
<div style="display:flex;gap:5px;margin-top:5px">
<input type="time" id="horaAlarme" style="flex:1">
<select id="alarmeMsg" style="flex:1"><option>Todas aleatórias</option></select>
</div>
<div style="display:flex;gap:5px;margin-top:5px">
<button class="azul" onclick="setAlarme()" style="flex:1">⏰ ATIVAR ALARME</button>
<button class="preto" onclick="pararAlarme()">⏹️ PARAR</button>
</div>
<small id="statusAlarme" style="color:#aaa">Nenhum alarme ativo</small>
<audio id="playerAlarme" controls style="width:100%;margin-top:6px;display:none"></audio>
</div>

<div class="filtros" id="filtros">
<button class="preto ativo" onclick="filtrar('todas')">Todas</button>
<button class="preto" onclick="filtrar('manha')">🌅 Manhã</button>
<button class="preto" onclick="filtrar('tarde')">🌇 Tarde</button>
<button class="preto" onclick="filtrar('noite')">🌙 Noite</button>
<button class="preto" onclick="filtrar('gratidao')">🙏 Gratidão</button>
<button class="preto" onclick="filtrar('motivacao')">💪 Motivação</button>
<button class="preto" onclick="filtrar('esperanca')">🙏 Esperança</button>
</div>

<div id="lista"></div>

<hr style="opacity:0.2">
<button class="preto" onclick="backup()" style="width:100%">💾 BACKUP (backup)</button>
<input type="file" id="rest" style="display:none" onchange="restaurar(event)">
<button class="preto" onclick="document.getElementById('rest').click()" style="width:100%;margin-top:6px">♻️ RESTAURAR</button>
<button class="preto" onclick="resetar()" style="width:100%;margin-top:6px;background:#500;color:#fff">🗑️ RESETAR TUDO</button>

<a href="../index.html" class="topo-voltar">⬅️ VOLTAR PRO PORTAL</a>
<a href="../index.html" style="color:#FFD700;display:block;text-align:center;margin:12px">VOLTAR PRO PORTAL</a>

<!-- BOTÃO FLUTUANTE DOURADO -->
<button class="fab-mini" id="fabMini" title="Instalar Mensagens">⬇️</button>

<script>
let padraoA=[
{text:'Bom dia! Que hoje seu dia seja abençoado, cheio de luz e gratidão. Vai dar certo!',cat:'manha'},
{text:'Acorde com fé! Deus já preparou um dia lindo pra você. Gratidão gera milagres!',cat:'manha'},
{text:'Bom dia povo! Sorria, agradeça, o melhor dia da sua vida é HOJE!',cat:'manha'},
{text:'Manhã de vitórias! Levanta, agradece e vai pra luta que a prosperidade te espera.',cat:'manha'},
{text:'Bom dia! Que sua conta transborde gratidão hoje. Banco Gratidão te abençoa!',cat:'manha'},
{text:'Boa tarde! Não desista agora, a tarde é hora de continuar firme no propósito.',cat:'tarde'},
{text:'Boa tarde! Se está difícil, é sinal que você está crescendo. Persista!',cat:'tarde'},
{text:'Tarde abençoada! Deus está vendo seu esforço, sua recompensa vem!',cat:'tarde'},
{text:'Boa tarde Portal do Povo! Compartilhe uma mensagem e alegre alguém hoje.',cat:'tarde'},
{text:'Força na tarde! Quem agradece na luta, prospera na vitória.',cat:'tarde'},
{text:'Boa noite! Descanse em paz, entregue nas mãos de Deus e durma tranquilo.',cat:'noite'},
{text:'Boa noite! Que seus sonhos sejam leves e seu amanhã seja próspero.',cat:'noite'},
{text:'Noite de gratidão! Agradeça pelo dia, mesmo difícil, amanhã será melhor.',cat:'noite'},
{text:'Boa noite povo abençoado! Dorme com fé que Deus cuida de tudo.',cat:'noite'},
{text:'Boa noite! Amanhã é uma nova chance de ser feliz e próspero!',cat:'noite'},
{text:'Gratidão transforma! Quanto mais você agradece, mais Deus te dá motivos.',cat:'gratidao'},
{text:'Seja grato pelo pouco, que o muito virá! Gratidão é a chave.',cat:'gratidao'},
{text:'Nunca pare de sonhar! Seu sonho é o projeto que Deus tem pra você.',cat:'motivacao'},
{text:'Esperança: mesmo na escuridão, existe uma luz te esperando!',cat:'esperanca'}
];

let mensagens = JSON.parse(localStorage.getItem('msgsPortal')||'null') || padraoA;
let filtroAtual='todas';

function salvar(){localStorage.setItem('msgsPortal',JSON.stringify(mensagens));}
function render(){
  const lista=document.getElementById('lista');
  lista.innerHTML='';
  let filtradas = filtroAtual==='todas' ? mensagens : mensagens.filter(m=>m.cat===filtroAtual);
  filtradas.forEach((m,i)=>{
    let div=document.createElement('div');
    div.className='card-msg';
    div.innerHTML=`<div>${m.text}</div><small>${m.cat} - ${new Date().toLocaleDateString()}</small><br><button class="preto" style="margin-top:6px" onclick="tocarMsg(${mensagens.indexOf(m)})">🔊 Ouvir</button> <button class="preto" onclick="apagar(${mensagens.indexOf(m)})">🗑️</button>`;
    lista.appendChild(div);
  });
  // atualiza select alarme
  const sel=document.getElementById('alarmeMsg');
  sel.innerHTML='<option value="">Todas aleatórias</option>'+mensagens.map((m,i)=>`<option value="${i}">${m.text.substring(0,30)}...</option>`).join('');
}

function filtrar(c){
  filtroAtual=c;
  document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('ativo'));
  event.target.classList.add('ativo');
  render();
}
function addMsg(){
  let t=document.getElementById('nova').value.trim();
  let cat=document.getElementById('periodo').value;
  if(!t) return alert('Escreva a mensagem!');
  mensagens.unshift({text:t,cat:cat});
  salvar(); render();
  document.getElementById('nova').value='';
}
function gerarIA(){
  let novas=[];
  for(let i=0;i<5;i++){
    let base=padraoA[Math.floor(Math.random()*padraoA.length)];
    novas.push({text:base.text+' 🙏✨ (IA)',cat:base.cat});
  }
  mensagens=[...novas,...mensagens];
  salvar(); render();
  document.getElementById('infoIA').innerText='5 mensagens novas geradas!';
}
function apagar(idx){ if(confirm('Apagar?')){mensagens.splice(idx,1); salvar(); render();}}
function backup(){
  let blob=new Blob([JSON.stringify(mensagens)],{type:'application/json'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mensagens_backup.json'; a.click();
}
function restaurar(e){
  let file=e.target.files[0]; if(!file) return;
  let r=new FileReader(); r.onload=x=>{try{mensagens=JSON.parse(x.target.result); salvar(); render(); alert('Restaurado!')}catch{alert('Erro no arquivo')}}; r.readAsText(file);
}
function resetar(){ if(confirm('Resetar tudo e voltar ao padrão?')){mensagens=[...padraoA]; salvar(); render();}}

let intervaloAlarme=null;
function setAlarme(){
  let h=document.getElementById('horaAlarme').value;
  if(!h) return alert('Escolha a hora!');
  document.getElementById('statusAlarme').innerText='Alarme ativo para '+h;
  intervaloAlarme=setInterval(()=>{
    let agora=new Date(); let hm=agora.getHours().toString().padStart(2,'0')+':'+agora.getMinutes().toString().padStart(2,'0');
    if(hm===h){
      let idx=document.getElementById('alarmeMsg').value;
      let msg = idx==='' ? mensagens[Math.floor(Math.random()*mensagens.length)].text : mensagens[idx].text;
      if('speechSynthesis' in window){ speechSynthesis.speak(new SpeechSynthesisUtterance(msg)); }
      alert('⏰ ALARME: '+msg);
      clearInterval(intervaloAlarme);
      document.getElementById('statusAlarme').innerText='Alarme tocou às '+h;
    }
  },60000);
}
function pararAlarme(){ clearInterval(intervaloAlarme); document.getElementById('statusAlarme').innerText='Nenhum alarme ativo'; }
function tocarMsg(i){ let m=mensagens[i]; if('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(m.text)); }

document.getElementById('audioFile').addEventListener('change', e=>{
  let f=e.target.files[0]; if(f){ addMsgAudio(f.name); }
});
document.getElementById('txtFile').addEventListener('change', e=>{
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=x=>{
    let linhas=x.target.result.split('\n');
    linhas.forEach(l=>{ if(l.trim()) mensagens.unshift({text:l.trim(),cat:'motivacao'}); });
    salvar(); render();
  }; r.readAsText(f);
});
function addMsgAudio(nome){ mensagens.unshift({text:'🎙️ Áudio: '+nome,cat:'motivacao'}); salvar(); render(); }

render();

// BOTÃO FLUTUANTE INSTALAÇÃO
let dpMini=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();dpMini=e;document.getElementById('fabMini').style.display='flex';});
document.getElementById('fabMini').addEventListener('click', async()=>{ if(!dpMini) return; dpMini.prompt(); const o=await dpMini.userChoice; if(o.outcome==='accepted') document.getElementById('fabMini').style.display='none'; dpMini=null; });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('../sw.js'); }
</script>
</body>
</html>
