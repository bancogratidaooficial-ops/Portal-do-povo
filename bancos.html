const padrao=[

{n:'C6 Bank',ico:'⚫',pkg:'com.c6bank.app',play:'com.c6bank.app',cor:'#222'},
{n:'PicPay',ico:'💚',pkg:'com.picpay',play:'com.picpay',cor:'#11c76f'},
{n:'Mercado Pago',ico:'💙',pkg:'com.mercadopago.wallet',play:'com.mercadopago.wallet',cor:'#009ee3'}
];
let bancos=JSON.parse(localStorage.getItem('bancos_v17')||'null')||padrao;

function render(){
let d=document.getElementById('lista');d.innerHTML='';
bancos.forEach((b,i)=>{
d.innerHTML+=`<div class="card"><div class="ico" style="background:${b.cor}22">${b.ico}</div><div class="nome">${b.n}<div style="font-weight:400;font-size:11px;color:#aaa">${b.pkg}</div></div><div class="btns"><button class="b abrir" onclick="abrirBanco(${i})">▶️ Abrir</button><button class="b inst" onclick="instalar(${i})">📲 INSTALAR</button><button class="b comp" onclick="share(${i})">📤</button></div><button class="lixeira" onclick="apagar(${i})">🗑️</button></div>`;
});
localStorage.setItem('bancos_v17',JSON.stringify(bancos));
}

// ABRIR DIRETO NO APP SE ESTIVER INSTALADO, SE NÃO VAI PRO PLAY STORE
function abrirBanco(i){
let pkg=bancos[i].pkg;
// Tenta abrir via intent Android
let intent=`intent://#Intent;package=${pkg};action=android.intent.action.VIEW;end`;
let start=Date.now();
window.location.href=intent;
// Se em 1.2s não abriu, manda pro Play Store
setTimeout(()=>{
if(Date.now()-start<1500) instalar(i);
},1200);
}
function instalar(i){
let play=bancos[i].play;
// Tenta abrir Play Store app primeiro
window.location.href=`market://details?id=${play}`;
// Fallback pro link https se não tiver Play Store
setTimeout(()=>{window.open(`https://play.google.com/store/apps/details?id=${play}`,'_blank')},800);
}
function share(i){if(navigator.share)navigator.share({title:bancos[i].n,text:`Baixa o ${bancos[i].n}: https://play.google.com/store/apps/details?id=${bancos[i].play}`});else{window.open(`https://wa.me/?text=${encodeURIComponent('Baixa '+bancos[i].n+' https://play.google.com/store/apps/details?id='+bancos[i].play)}`)}}
function apagar(i){if(confirm(`Apagar ${bancos[i].n}?`)){bancos.splice(i,1);render()}}
